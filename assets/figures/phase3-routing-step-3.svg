<svg xmlns="http://www.w3.org/2000/svg" width="720" height="407" viewBox="0 0 720 407" role="img" aria-labelledby="title desc"><title id="title">Choose the routing engine by workload</title><desc id="desc">Every engine needs valid endpoints, acceptable snapping and an explicit cost model. Check status and units rather than treating any returned route as comparable.</desc><rect width="720" height="407" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Choose the routing engine by workload</text><rect x="32" y="80" width="206.66666666666666" height="307" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">OSRM</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Fast preprocessed</text><text x="46" y="186" font-size="18" fill="#213e45" text-anchor="start">routes</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">Check routing</text><text x="46" y="258" font-size="18" fill="#213e45" text-anchor="start">profile</text><text x="46" y="305" font-size="18" fill="#213e45" text-anchor="start">Use matrices for</text><text x="46" y="330" font-size="18" fill="#213e45" text-anchor="start">batches</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Valhalla</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Dynamic costing</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Isochrones and modes</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">Check response units</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">pgRouting</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Graph queries in SQL</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Explicit edge costs</text><text x="483.3333333333333" y="255" font-size="18" fill="#213e45" text-anchor="start">Inspect graph</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">topology</text></g></svg>
