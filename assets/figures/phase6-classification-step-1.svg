<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436" role="img" aria-labelledby="title desc"><title id="title">From legend to independently assessed map</title><desc id="desc">Training and assessment are different data roles. For transfer to new areas, the split must also respect spatial separation.</desc><rect width="720" height="436" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">From legend to independently assessed map</text><rect x="64" y="80" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="106" font-size="19" fill="#213e45" text-anchor="start">Legend and observable class definitions</text><line x1="360" y1="143" x2="360" y2="160" stroke="#23745d" stroke-width="2" /><path d="M354 154L360 161L366 154" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="164" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="190" font-size="19" fill="#213e45" text-anchor="start">Training data → features → fitted model</text><line x1="360" y1="227" x2="360" y2="244" stroke="#23745d" stroke-width="2" /><path d="M354 238L360 245L366 238" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="248" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="274" font-size="19" fill="#213e45" text-anchor="start">Chunked prediction and documented post-processing</text><line x1="360" y1="311" x2="360" y2="328" stroke="#23745d" stroke-width="2" /><path d="M354 322L360 329L366 322" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="332" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="358" font-size="19" fill="#213e45" text-anchor="start">Independent reference sample → accuracy</text></g></svg>
