<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-labelledby="title desc"><title id="title">Concept model, encoding and profile differ</title><desc id="desc">An XML namespace is not a conformity result. The model, encoding and applicable profile impose different requirements that need appropriate validation.</desc><rect width="720" height="285" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Concept model, encoding and profile differ</text><rect x="32" y="80" width="206.66666666666666" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">ISO 19115</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Metadata concepts</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">What is described?</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">XML implementations</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">19139 / 19115-3</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">How is it encoded?</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">INSPIRE</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">EU requirements</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Which rules apply?</text></g></svg>
