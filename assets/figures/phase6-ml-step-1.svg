<svg xmlns="http://www.w3.org/2000/svg" width="720" height="409" viewBox="0 0 720 409" role="img" aria-labelledby="title desc"><title id="title">Different tasks, different outputs</title><desc id="desc">IoU = TP/(TP+FP+FN). An all-background prediction can have high overall accuracy while failing to detect the important class.</desc><rect width="720" height="409" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Different tasks, different outputs</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Classification</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">One chip → one class</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Example: forest</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">scene</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Accuracy / F1</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Segmentation</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">One class per pixel</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Example: canopy mask</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">Per-class IoU / F1</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="309" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Detection /</text><text x="483.3333333333333" y="139" font-size="20" fill="#23745d" text-anchor="start">regression</text><text x="483.3333333333333" y="188" font-size="18" fill="#213e45" text-anchor="start">Boxes / continuous</text><text x="483.3333333333333" y="213" font-size="18" fill="#213e45" text-anchor="start">values</text><text x="483.3333333333333" y="260" font-size="18" fill="#213e45" text-anchor="start">Buildings / canopy</text><text x="483.3333333333333" y="285" font-size="18" fill="#213e45" text-anchor="start">height</text><text x="483.3333333333333" y="332" font-size="18" fill="#213e45" text-anchor="start">mAP / RMSE + bias</text></g></svg>
