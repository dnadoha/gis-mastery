<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Reconcile the result with the full grid</title><desc id="desc">200 selected + 40 outside = 240 in the grid. The selected count uses whole-cell populations and direct distance, rather than surveyed residents or walking access.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Reconcile the result with the full grid</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">People · unique cell-centre selection</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Selected: 20 cells</text><rect x="300" y="112" width="266.66666666666674" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">200</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Outside: 4 cells</text><rect x="300" y="172" width="53.333333333333314" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">40</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Whole grid: 24 cells</text><rect x="300" y="232" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">240</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">240</text></g></svg>
