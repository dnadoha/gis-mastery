<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="title desc"><title id="title">Check the known parcel point’s tile</title><desc id="desc">At z14 there are 16384 rows, so 16383 − 5384 = 10999. Tilemath can recompute the projected bounds to check the same location independently.</desc><rect width="720" height="256" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Check the known parcel point’s tile</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Longitude 4.8926°, latitude 52.3731°</text><rect x="36" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="148" font-size="18" fill="#213e45" text-anchor="middle">Zoom</text><rect x="198" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="148" font-size="18" fill="#213e45" text-anchor="middle">Column x</text><rect x="360" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="148" font-size="18" fill="#213e45" text-anchor="middle">XYZ row</text><rect x="522" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="148" font-size="18" fill="#213e45" text-anchor="middle">MBTiles row</text><rect x="36" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="196" font-size="18" fill="#213e45" text-anchor="middle">14</text><rect x="198" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="196" font-size="18" fill="#213e45" text-anchor="middle">8414</text><rect x="360" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="196" font-size="18" fill="#213e45" text-anchor="middle">5384</text><rect x="522" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="196" font-size="18" fill="#213e45" text-anchor="middle">10999</text></g></svg>
