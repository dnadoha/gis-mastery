<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Raster index → corner → centre</title><desc id="desc">A north-up raster with two-kilometre cells: the first centre lies one kilometre east and one kilometre south of the upper-left corner.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Raster index → corner → centre</text><rect x="32" y="110" width="896" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><rect x="80" y="170" width="72" height="72" fill="#d5e8f6" stroke="#b4c8d0" stroke-width="2"/><rect x="152" y="170" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="224" y="170" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="296" y="170" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="80" y="242" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="152" y="242" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="224" y="242" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="296" y="242" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="80" y="314" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="152" y="314" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="224" y="314" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><rect x="296" y="314" width="72" height="72" fill="#fff" stroke="#b4c8d0" stroke-width="2"/><line x1="80" y1="145" x2="368" y2="145" stroke="#213e45" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(368 145) rotate(0)" fill="none" stroke="#213e45" stroke-width="2"/><text x="175" y="133" font-size="18" fill="#213e45" text-anchor="start">column →</text><line x1="52" y1="170" x2="52" y2="386" stroke="#213e45" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(52 386) rotate(90)" fill="none" stroke="#213e45" stroke-width="2"/><text x="65" y="421" font-size="17" fill="#213e45" text-anchor="start">row increases down; northing decreases</text><circle cx="80" cy="170" r="6" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="116" cy="206" r="6" fill="#246eab" stroke="white" stroke-width="2"/><line x1="80" y1="170" x2="116" y2="206" stroke="#246eab" stroke-width="2" /><text x="420" y="158" font-size="22" fill="#ae521f" text-anchor="start">Origin = upper-left cell corner</text><text x="420" y="190" font-size="23" fill="#213e45" text-anchor="start">(570000, 5820000) m</text><text x="420" y="244" font-size="22" fill="#246eab" text-anchor="start">Cell (col 0, row 0) centre</text><text x="420" y="276" font-size="23" fill="#213e45" text-anchor="start">(571000, 5819000) m</text><text x="420" y="330" font-size="20" fill="#213e45" text-anchor="start">Pixel width = +2000 m</text><text x="420" y="362" font-size="20" fill="#213e45" text-anchor="start">Pixel height = −2000 m</text><text x="420" y="423" font-size="22" fill="#213e45" text-anchor="start">Centre uses (col + ½, row + ½).</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Exact north-up example from the note. Array access is [row, col]; map coordinates are (x, y).</text></g></svg>
