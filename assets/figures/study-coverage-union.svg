<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Overlapping service areas must not double-count</title><desc id="desc">Two illustrative cell masks select nine cells each with two cells shared. Ten people per cell gives 160 people in the union, rather than 180.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Overlapping service areas must not double-count</text><rect x="32" y="110" width="896" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><rect x="65" y="170" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="94" y="208" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="126" y="170" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="155" y="208" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="187" y="170" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="216" y="208" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="248" y="170" width="59" height="59" fill="#f4f7f8" stroke="#b4c8d0" stroke-width="2"/><text x="277" y="208" font-size="19" fill="#213e45" text-anchor="middle">–</text><rect x="309" y="170" width="59" height="59" fill="#f4f7f8" stroke="#b4c8d0" stroke-width="2"/><text x="338" y="208" font-size="19" fill="#213e45" text-anchor="middle">–</text><rect x="65" y="231" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="94" y="269" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="126" y="231" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="155" y="269" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="187" y="231" width="59" height="59" fill="#ead2b4" stroke="#b4c8d0" stroke-width="2"/><text x="216" y="269" font-size="19" fill="#213e45" text-anchor="middle">AB</text><rect x="248" y="231" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="277" y="269" font-size="19" fill="#213e45" text-anchor="middle">B</text><rect x="309" y="231" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="338" y="269" font-size="19" fill="#213e45" text-anchor="middle">B</text><rect x="65" y="292" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="94" y="330" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="126" y="292" width="59" height="59" fill="#d6e9de" stroke="#b4c8d0" stroke-width="2"/><text x="155" y="330" font-size="19" fill="#213e45" text-anchor="middle">A</text><rect x="187" y="292" width="59" height="59" fill="#ead2b4" stroke="#b4c8d0" stroke-width="2"/><text x="216" y="330" font-size="19" fill="#213e45" text-anchor="middle">AB</text><rect x="248" y="292" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="277" y="330" font-size="19" fill="#213e45" text-anchor="middle">B</text><rect x="309" y="292" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="338" y="330" font-size="19" fill="#213e45" text-anchor="middle">B</text><rect x="65" y="353" width="59" height="59" fill="#f4f7f8" stroke="#b4c8d0" stroke-width="2"/><text x="94" y="391" font-size="19" fill="#213e45" text-anchor="middle">–</text><rect x="126" y="353" width="59" height="59" fill="#f4f7f8" stroke="#b4c8d0" stroke-width="2"/><text x="155" y="391" font-size="19" fill="#213e45" text-anchor="middle">–</text><rect x="187" y="353" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="216" y="391" font-size="19" fill="#213e45" text-anchor="middle">B</text><rect x="248" y="353" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="277" y="391" font-size="19" fill="#213e45" text-anchor="middle">B</text><rect x="309" y="353" width="59" height="59" fill="#d9e9f5" stroke="#b4c8d0" stroke-width="2"/><text x="338" y="391" font-size="19" fill="#213e45" text-anchor="middle">B</text><text x="65" y="149" font-size="17" fill="#213e45" text-anchor="start">Each selected cell contains 10 people</text><text x="425" y="161" font-size="23" fill="#23745d" text-anchor="start">A: 9 cells = 90 people</text><text x="425" y="205" font-size="23" fill="#246eab" text-anchor="start">B: 9 cells = 90 people</text><text x="425" y="249" font-size="23" fill="#ae521f" text-anchor="start">In both: 2 cells = 20 people</text><text x="425" y="315" font-size="25" fill="#213e45" text-anchor="start">Union = A + B − overlap</text><text x="425" y="357" font-size="25" fill="#213e45" text-anchor="start">90 + 90 − 20 = 160 people</text><text x="425" y="423" font-size="20" fill="#213e45" text-anchor="start">Count each selected cell once.</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Synthetic cell-selection masks, not real shelter catchments. Overlap cells are labelled AB.</text></g></svg>
