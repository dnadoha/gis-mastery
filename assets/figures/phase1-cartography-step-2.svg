<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="title desc"><title id="title">Colour encodes selection, not population</title><desc id="desc">The text labels make the two categories readable without colour. A green cell does not hold more people; only its centre passes the school-distance test.</desc><rect width="720" height="256" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Colour encodes selection, not population</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Both example cells contain ten people</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#b9dfc9" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">Selected</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#e5e8e8" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">Not selected</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#b9dfc9" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">10 people</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#e5e8e8" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">10 people</text></g></svg>
