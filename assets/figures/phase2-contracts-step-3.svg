<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">A raster needs its origin and pixel spacing</title><desc id="desc">The row/column pairs use zero-based indexing. Moving down one 2.5 m row decreases northing; finding a centre first requires a half-cell offset.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A raster needs its origin and pixel spacing</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">DEM north-west corner and first two centres</text><rect x="36" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="148" font-size="18" fill="#213e45" text-anchor="middle">Position</text><rect x="252" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">Easting m</text><rect x="468" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="148" font-size="18" fill="#213e45" text-anchor="middle">Northing m</text><rect x="36" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="196" font-size="18" fill="#213e45" text-anchor="middle">Corner</text><rect x="252" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="196" font-size="18" fill="#213e45" text-anchor="middle">121000</text><rect x="468" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="196" font-size="18" fill="#213e45" text-anchor="middle">488000</text><rect x="36" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="244" font-size="18" fill="#213e45" text-anchor="middle">Centre (0,0)</text><rect x="252" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="244" font-size="18" fill="#213e45" text-anchor="middle">121001.25</text><rect x="468" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="244" font-size="18" fill="#213e45" text-anchor="middle">487998.75</text><rect x="36" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="292" font-size="18" fill="#213e45" text-anchor="middle">Centre (1,0)</text><rect x="252" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="292" font-size="18" fill="#213e45" text-anchor="middle">121001.25</text><rect x="468" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="292" font-size="18" fill="#213e45" text-anchor="middle">487996.25</text></g></svg>
