<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Check the same school before changing anything</title><desc id="scene-desc">School A is invented. Its example geographic position is near Dhaka, not a surveyed school entrance.</desc><rect width="960" height="540" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="33" font-size="14" fill="#284c40" text-anchor="start">OUR NEIGHBOURHOOD / SAME PROJECT, NEXT STEP</text><text x="32" y="75" font-size="25" fill="#284c40" text-anchor="start">Check the same school before changing anything</text><rect x="45" y="115" width="415" height="295" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="70" y="155" font-size="25" fill="#284c40" text-anchor="start">School A</text><text x="70" y="215" font-size="24" fill="#284c40" text-anchor="start">Longitude: 90.4125° E</text><text x="70" y="263" font-size="24" fill="#284c40" text-anchor="start">Latitude:   23.8103° N</text><text x="70" y="326" font-size="18" fill="#284c40" text-anchor="start">Known meaning from our file</text><text x="500" y="166" font-size="23" fill="#284c40" text-anchor="start">If the fields are swapped:</text><text x="500" y="222" font-size="22" fill="#a34f26" text-anchor="start">Latitude becomes 90.4125°</text><text x="500" y="274" font-size="18" fill="#284c40" text-anchor="start">Allowed latitude: −90° to +90°</text><text x="500" y="324" font-size="18" fill="#284c40" text-anchor="start">So this interpretation fails.</text><text x="500" y="373" font-size="18" fill="#284c40" text-anchor="start">Check fields before moving a pin.</text><text x="32" y="514" font-size="15" fill="#284c40" text-anchor="start">School A is invented. Its example geographic position is near Dhaka, not a surveyed school entrance.</text></g></svg>
