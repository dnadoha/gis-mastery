<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">Check four grid properties before arithmetic</title><desc id="desc">Equal array dimensions alone do not establish alignment. Resampling class codes needs a categorical method, and all_touched is a separate selection choice.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Check four grid properties before arithmetic</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Raster A and raster B must refer to the same cells</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">CRS</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">Same reference and units</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">Transform</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">Same origin and directions</text><rect x="36" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="244" font-size="18" fill="#213e45" text-anchor="middle">Shape</text><rect x="360" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="244" font-size="18" fill="#213e45" text-anchor="middle">Same row and column counts</text><rect x="36" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="292" font-size="18" fill="#213e45" text-anchor="middle">Resolution</text><rect x="360" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="292" font-size="18" fill="#213e45" text-anchor="middle">Same cell spacing</text></g></svg>
