<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Compare a reading with a trusted position</title><desc id="desc">Illustrative errors: the phone reading is 6 m east and 8 m north of the accepted entrance, so its position error is 10 m. More displayed digits would not fix it.</desc><rect width="720" height="660" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Compare a reading with a trusted position</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">-10</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">-10</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">-5</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">-5</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">5</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">5</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">10</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">10</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">Northing error (m)</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">Easting error (m)</text><circle cx="330" cy="340" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="342" y="328" font-size="18" fill="#213e45" text-anchor="start">Truth</text><circle cx="468" cy="156" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="456" y="181" font-size="18" fill="#213e45" text-anchor="end">Phone</text></g></svg>
