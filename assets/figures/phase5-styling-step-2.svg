<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">Three views answer different questions</title><desc id="desc">A cluster is a discrete count; a heatmap is a continuous rendering. Neither replaces a complete server-side query for exact inventory totals.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Three views answer different questions</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Individual points</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">One symbol per tree</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Inspect ids and</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">condition</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">High zoom</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Cluster marker</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Count of loaded</text><text x="264.66666666666663" y="186" font-size="18" fill="#213e45" text-anchor="start">points</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">Expand on click</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">Low / medium zoom</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Heatmap</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Overlapping kernels</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Density or weighted</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">sum</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">Visual summary</text></g></svg>
