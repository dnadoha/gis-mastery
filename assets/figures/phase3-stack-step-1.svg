<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">Python wrappers delegate different jobs</title><desc id="desc">GeoPandas combines a table with geometry and these supporting tools. Shapely handles shapes; it does not open elevation rasters.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Python wrappers delegate different jobs</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">GDAL / OGR</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Rasterio / pyogrio</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Raster and vector</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">I/O</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Raster warping</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">PROJ</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">pyproj</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Coordinate</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">operations</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">Reference systems</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">GEOS</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Shapely</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Planar geometry</text><text x="483.3333333333333" y="255" font-size="18" fill="#213e45" text-anchor="start">Predicates and</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">overlay</text></g></svg>
