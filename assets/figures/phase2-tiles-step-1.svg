<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">XYZ and TMS number rows in opposite directions</title><desc id="desc">There are four rows at z=2. TMS y = 2^z − 1 − XYZ y; the column x is unchanged. The world footprint is the same in both schemes.</desc><rect width="720" height="400" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">XYZ and TMS number rows in opposite directions</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">z=2 · same row positions, different labels</text><rect x="36" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="148" font-size="18" fill="#213e45" text-anchor="middle">From north</text><rect x="252" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">XYZ y</text><rect x="468" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="148" font-size="18" fill="#213e45" text-anchor="middle">TMS y</text><rect x="36" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="196" font-size="18" fill="#213e45" text-anchor="middle">Top</text><rect x="252" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="196" font-size="18" fill="#213e45" text-anchor="middle">0</text><rect x="468" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="196" font-size="18" fill="#213e45" text-anchor="middle">3</text><rect x="36" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="244" font-size="18" fill="#213e45" text-anchor="middle">Next</text><rect x="252" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="244" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="468" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="244" font-size="18" fill="#213e45" text-anchor="middle">2</text><rect x="36" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="292" font-size="18" fill="#213e45" text-anchor="middle">Next</text><rect x="252" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="292" font-size="18" fill="#213e45" text-anchor="middle">2</text><rect x="468" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="292" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="36" y="310" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="340" font-size="18" fill="#213e45" text-anchor="middle">Bottom</text><rect x="252" y="310" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="340" font-size="18" fill="#213e45" text-anchor="middle">3</text><rect x="468" y="310" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="340" font-size="18" fill="#213e45" text-anchor="middle">0</text></g></svg>
