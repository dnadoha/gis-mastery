<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">Lower slope receives a higher score</title><desc id="desc">The chosen endpoints define the preference curve. A different use case may need a different direction, threshold or shape.</desc><rect width="720" height="700" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Lower slope receives a higher score</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">3.75</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">0.25</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">7.5</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">0.5</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">11.25</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">0.75</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">15</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">1</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">Suitability factor</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">Slope (degrees)</text><polyline points="100,110 161.33333333333334,171.31799999999998 345.33333333333337,355.318 560,570" fill="none" stroke="#23745d" stroke-width="3" /><line x1="36" y1="664" x2="70" y2="664" stroke="#23745d" stroke-width="2" /><text x="82" y="670" font-size="17" fill="#213e45" text-anchor="start">1 − slope / 15</text></g></svg>
