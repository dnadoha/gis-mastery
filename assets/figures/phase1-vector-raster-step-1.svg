<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Objects and fields describe the same place</title><desc id="desc">The vector objects identify individual features. The raster covers land with cells whose values have a defined meaning; it is not a collection of household points.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Objects and fields describe the same place</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Vector</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">School → point</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Road → line</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Park → polygon</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Raster</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Rows and columns</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">One value per cell</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Population per cell</text></g></svg>
