<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Resampling depends on the value’s meaning</title><desc id="desc">A whole-cell count is extensive; a temperature is an intensive measurement. For our school calculation we retain the original grid rather than resampling it.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Resampling depends on the value’s meaning</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Counts</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">10 + 10 + 10 + 10</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Aligned aggregation: 40</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Preserve total people</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Measurements</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Four temperatures</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Mean can be meaningful</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Do not sum degrees</text></g></svg>
