<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Steps 4–5 · two complementary checks</title><desc id="desc">Hotspots assess arrangement; reference sampling assesses classification error. One cannot substitute for the other.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Steps 4–5 · two complementary checks</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Spatial pattern</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">500 m valid-area fractions</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Moran + Gi* with stated weights</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Multiple-testing adjustment</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Map accuracy</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Independent stratified sample</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">UA / PA / F1 by class</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Adjusted area + interval</text></g></svg>
