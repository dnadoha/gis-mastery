<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Three surfaces, two kinds of height</title><desc id="desc">A terrain point is 50 metres above the ellipsoid and 30 metres above the geoid. Geoid undulation is positive 20 metres: h = H + N.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Three surfaces, two kinds of height</text><rect x="32" y="100" width="896" height="380" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><path d="M60 215L155 190L230 220L320 160L400 180L500 145L620 205L750 175L890 215" fill="none" stroke="#23745d" stroke-width="4"/><path d="M60 340Q260 280 400 300T890 325" fill="none" stroke="#246eab" stroke-width="4"/><line x1="60" y1="380" x2="890" y2="380" stroke="#ae521f" stroke-width="2" stroke-dasharray="8 5"/><circle cx="400" cy="180" r="6" fill="#23745d" stroke="white" stroke-width="2"/><line x1="400" y1="180" x2="400" y2="380" stroke="#213e45" stroke-width="2" stroke-dasharray="4 4"/><line x1="440" y1="380" x2="440" y2="180" stroke="#ae521f" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(440 180) rotate(-90)" fill="none" stroke="#ae521f" stroke-width="2"/><line x1="550" y1="300" x2="550" y2="180" stroke="#23745d" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(550 180) rotate(-90)" fill="none" stroke="#23745d" stroke-width="2"/><line x1="660" y1="380" x2="660" y2="300" stroke="#246eab" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(660 300) rotate(-90)" fill="none" stroke="#246eab" stroke-width="2"/><line x1="400" y1="180" x2="550" y2="180" stroke="#aebfc4" stroke-width="2" stroke-dasharray="4 4"/><line x1="400" y1="300" x2="660" y2="300" stroke="#aebfc4" stroke-width="2" stroke-dasharray="4 4"/><text x="65" y="140" font-size="20" fill="#23745d" text-anchor="start">Physical terrain</text><text x="65" y="285" font-size="20" fill="#246eab" text-anchor="start">Geoid</text><text x="65" y="414" font-size="20" fill="#ae521f" text-anchor="start">Reference ellipsoid</text><text x="451" y="255" font-size="19" fill="#ae521f" text-anchor="start">h = 50 m</text><text x="563" y="240" font-size="19" fill="#23745d" text-anchor="start">H = 30 m</text><text x="677" y="347" font-size="19" fill="#246eab" text-anchor="start">N = +20 m</text><text x="390" y="452" font-size="23" fill="#213e45" text-anchor="start">h = H + N     →     50 = 30 + 20</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Local schematic; vertical separation exaggerated. h ≈ H + N; distinct vertical directions simplified.</text></g></svg>
