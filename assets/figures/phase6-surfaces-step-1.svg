<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">A quartic kernel fades to zero at h</title><desc id="desc">One radial cross-section, normalised to peak 1. The full 2D intensity includes 3/(πh²), sums all events, and needs edge-effect consideration.</desc><rect width="720" height="700" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A quartic kernel fades to zero at h</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">0.3</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">0.25</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">0.6</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">0.5</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">0.9</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">0.75</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">1.2</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">1</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">Relative kernel weight</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">Distance / bandwidth h</text><polyline points="100,110 176.66666666666669,146.06400000000002 253.33333333333334,245.42399999999998 330,381.584 406.6666666666667,510.384 483.33333333333337,570 560,570" fill="none" stroke="#23745d" stroke-width="3" /><line x1="36" y1="664" x2="70" y2="664" stroke="#23745d" stroke-width="2" /><text x="82" y="670" font-size="17" fill="#213e45" text-anchor="start">(1 − u²)² for u &lt; 1</text></g></svg>
