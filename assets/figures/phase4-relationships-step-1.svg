<svg xmlns="http://www.w3.org/2000/svg" width="720" height="734" viewBox="0 0 720 734" role="img" aria-labelledby="title desc"><title id="title">Two districts meet at one shared boundary</title><desc id="desc">Equal-scale metre axes show the actual synthetic fixture. I2 lies exactly on the shared x=122000 boundary. Each 3000 × 5000 m district has area 15000000 m².</desc><rect width="720" height="734" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Two districts meet at one shared boundary</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">1500</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">1500</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">3000</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">3000</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">4500</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">4500</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">6000</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">6000</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">Northing minus 486000 (m)</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">Easting minus 119000 (m)</text><polyline points="100,570 330,570 330,186.66666666666663 100,186.66666666666663 100,570" fill="#e1efe5" stroke="#23745d" stroke-width="3" /><line x1="36" y1="664" x2="70" y2="664" stroke="#23745d" stroke-width="2" /><text x="82" y="670" font-size="17" fill="#213e45" text-anchor="start">West · easting 119000…122000</text><polyline points="330,570 560,570 560,186.66666666666663 330,186.66666666666663 330,570" fill="#f5e7d5" stroke="#ae521f" stroke-width="3" stroke-dasharray="8 4"/><line x1="36" y1="698" x2="70" y2="698" stroke="#ae521f" stroke-width="2" stroke-dasharray="8 4"/><text x="82" y="704" font-size="17" fill="#213e45" text-anchor="start">East · easting 122000…125000</text><circle cx="207.33333333333331" cy="470.3333333333333" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="219.33333333333331" y="458.3333333333333" font-size="18" fill="#213e45" text-anchor="start">I1</text><circle cx="330" cy="493.33333333333337" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="342" y="481.33333333333337" font-size="18" fill="#213e45" text-anchor="start">I2</text><circle cx="284" cy="340" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="296" y="328" font-size="18" fill="#213e45" text-anchor="start">I3</text></g></svg>
