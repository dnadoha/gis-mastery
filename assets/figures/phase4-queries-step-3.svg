<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">DBSCAN follows density connections</title><desc id="desc">I1 links the other two incidents at eps 2000 even though I2–I3 exceeds eps. Cluster membership does not require every pair to be within the radius.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">DBSCAN follows density connections</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">eps = 1000</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">minpoints = 2</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">All three incidents: noise</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">No qualifying neighbours</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">eps = 2000</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">minpoints = 2</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">I2 ↔ I1 ↔ I3</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">One connected cluster</text></g></svg>
