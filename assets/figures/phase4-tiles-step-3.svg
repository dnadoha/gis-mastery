<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Keep display and analytical geometry distinct</title><desc id="desc">A nonempty bytea result proves only that bytes were produced. Verify expected features, supported zooms and meaningful regional bounds before calling the tile correct.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Keep display and analytical geometry distinct</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Display copy</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">EPSG:3857</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Clip / simplify / quantise</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Inspect decoded tile ids</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Analysis copy</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Suitable local CRS</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Authoritative geometry</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Measure with known units</text></g></svg>
