<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Two paths, two cache contracts</title><desc id="desc">Vary alone is not an access-control policy. Cache keys, gateway authorization and origin responses must agree.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Two paths, two cache contracts</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Public tiles</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">tile_reader + is_public</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Same response for everyone</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Shared cache permitted</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Private feature API</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Verified org + RLS</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Response depends on identity</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">private, no-store</text></g></svg>
