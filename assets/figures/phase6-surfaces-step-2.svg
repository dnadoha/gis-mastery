<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Four gauges around the village</title><desc id="desc">Equal horizontal and vertical scales. G1=10, G2=20, G3=30, G4=40 mm. V is the unsampled village, not a fifth measurement.</desc><rect width="720" height="660" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Four gauges around the village</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">2.5</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">2.5</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">5</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">5</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">7.5</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">7.5</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">10</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">10</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">y (km)</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">x (km)</text><circle cx="100" cy="570" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="112" y="558" font-size="18" fill="#213e45" text-anchor="start">G1</text><circle cx="560" cy="570" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="548" y="558" font-size="18" fill="#213e45" text-anchor="end">G2</text><circle cx="100" cy="110" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="112" y="135" font-size="18" fill="#213e45" text-anchor="start">G3</text><circle cx="560" cy="110" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="548" y="135" font-size="18" fill="#213e45" text-anchor="end">G4</text><circle cx="238" cy="386" r="7" fill="#ae521f" stroke="white" stroke-width="2"/><text x="250" y="374" font-size="18" fill="#213e45" text-anchor="start">V</text></g></svg>
