<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">Choose from the interaction you need</title><desc id="desc">GeoJSON stays [lon, lat]. Leaflet LatLng constructors take [lat, lon]; Cesium fromDegrees also accepts height.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Choose from the interaction you need</text><rect x="32" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">MapLibre</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Vector tiles</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Style expressions</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Smooth zoom</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">OpenLayers</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">OGC + many CRSs</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Draw / Modify / Snap</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">GIS editing</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Other needs</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Leaflet: simple 2D</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Cesium: 3D globe</text><text x="483.3333333333333" y="255" font-size="18" fill="#213e45" text-anchor="start">deck.gl: GPU</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">overlays</text></g></svg>
