<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Text confidence and location accuracy differ</title><desc id="desc">A high similarity score measures the matching process, not positional error. Different reverse-geocoding questions can correctly return different answers.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Text confidence and location accuracy differ</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Strong text match</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Name matches exactly</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">May locate a street centre</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Not a roof-level guarantee</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Reverse lookup</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Containing district?</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Nearest address?</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Declare the spatial query</text></g></svg>
