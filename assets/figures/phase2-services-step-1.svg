<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">Ask for the kind of result you need</title><desc id="desc">A painted map differs from full features or numerical coverage values. Feature-info support on a map service does not make its image an analytical raster.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Ask for the kind of result you need</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Service family → payload</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">WMS / WMTS</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">Rendered map / image tile</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">WFS</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">Vector features</text><rect x="36" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="244" font-size="18" fill="#213e45" text-anchor="middle">WCS</text><rect x="360" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="244" font-size="18" fill="#213e45" text-anchor="middle">Coverage values</text><rect x="36" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="292" font-size="18" fill="#213e45" text-anchor="middle">CSW</text><rect x="360" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="292" font-size="18" fill="#213e45" text-anchor="middle">Metadata records</text></g></svg>
