<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-labelledby="title desc"><title id="title">Each graph edge has two directional contracts</title><desc id="desc">The second row makes the edge one-way from 5 to 6. Negative costs denote absent traversal in pgRouting; they are not negative weights for Dijkstra to follow.</desc><rect width="720" height="304" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Each graph edge has two directional contracts</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Illustrative edge 9 direction semantics</text><rect x="36" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="148" font-size="18" fill="#213e45" text-anchor="middle">source</text><rect x="198" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="148" font-size="18" fill="#213e45" text-anchor="middle">target</text><rect x="360" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="148" font-size="18" fill="#213e45" text-anchor="middle">Forward</text><rect x="522" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="148" font-size="18" fill="#213e45" text-anchor="middle">Reverse</text><rect x="36" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="196" font-size="18" fill="#213e45" text-anchor="middle">5</text><rect x="198" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="196" font-size="18" fill="#213e45" text-anchor="middle">6</text><rect x="360" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="196" font-size="18" fill="#213e45" text-anchor="middle">cost ≥ 0</text><rect x="522" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="196" font-size="18" fill="#213e45" text-anchor="middle">reverse_cost ≥ 0</text><rect x="36" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="244" font-size="18" fill="#213e45" text-anchor="middle">5</text><rect x="198" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="244" font-size="18" fill="#213e45" text-anchor="middle">6</text><rect x="360" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="244" font-size="18" fill="#213e45" text-anchor="middle">cost ≥ 0</text><rect x="522" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="244" font-size="18" fill="#213e45" text-anchor="middle">−1: absent</text></g></svg>
