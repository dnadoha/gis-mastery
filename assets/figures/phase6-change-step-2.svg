<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">Backscatter is a physical response</title><desc id="desc">Terrain correction and shadow/layover masks matter. Optical intuition does not directly transfer to radar intensity.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Backscatter is a physical response</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Calm water</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Specular reflection</text><text x="46" y="186" font-size="18" fill="#213e45" text-anchor="start">away</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">Often dark in VV</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Wind can brighten it</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Vegetation</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Volume scattering</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">VH often useful</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">Flooding can</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">brighten</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Urban / terrain</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Double-bounce can be</text><text x="483.3333333333333" y="186" font-size="18" fill="#213e45" text-anchor="start">bright</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">Shadow can be dark</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">Geometry matters</text></g></svg>
