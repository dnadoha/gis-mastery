<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">Same synthetic task, different validation</title><desc id="desc">The 34-unit result rises slightly, showing fold composition matters. A plateau is evidence to interpret, not a rule that every larger block must lower the score.</desc><rect width="720" height="450" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Same synthetic task, different validation</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">R² · reference results, with coordinates</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Random five-fold</text><rect x="300" y="112" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">0.646</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">10-unit blocks</text><rect x="300" y="172" width="268.9783281733746" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">0.543</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">20-unit blocks</text><rect x="300" y="232" width="248.66873065015477" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">0.502</text><text x="36" y="315" font-size="17" fill="#213e45" text-anchor="start">25-unit blocks</text><rect x="300" y="292" width="229.84520123839002" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="315" font-size="17" fill="#213e45" text-anchor="end">0.464</text><text x="36" y="375" font-size="17" fill="#213e45" text-anchor="start">34-unit blocks</text><rect x="300" y="352" width="