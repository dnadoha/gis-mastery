<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">A 10 × 10 × 6 m building contract</title><desc id="desc">The dimensions are the teaching example. Validate closure, orientation and self-intersections before trusting derived quantities.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A 10 × 10 × 6 m building contract</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Geometry</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">8 shared vertices</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">6 closed faces</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Consistent</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">orientation</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Meaning and units</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Building id bldg-1</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Height 6 m</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">Declared CRS / datum</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Checkable result</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Footprint 100 m²</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Volume 600 m³</text><text x="483.3333333333333" y="255" font-size="18" fill="#213e45" text-anchor="start">Only for valid solid</text></g></svg>
