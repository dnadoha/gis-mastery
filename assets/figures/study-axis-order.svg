<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">A coordinate swap changes the location</title><desc id="desc">Two exact coordinate pairs on a longitude/latitude graticule: Amsterdam and its swapped position in the Indian Ocean.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">A coordinate swap changes the location</text><rect x="32" y="100" width="896" height="380" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><line x1="100" y1="420" x2="100" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="420" x2="520" y2="420" stroke="#d3dfe3" stroke-width="2" /><text x="100" y="447" font-size="16" fill="#213e45" text-anchor="middle">0°</text><text x="85" y="425" font-size="16" fill="#213e45" text-anchor="end">0°</text><line x1="170" y1="420" x2="170" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="372" x2="520" y2="372" stroke="#d3dfe3" stroke-width="2" /><text x="170" y="447" font-size="16" fill="#213e45" text-anchor="middle">10°</text><text x="85" y="377" font-size="16" fill="#213e45" text-anchor="end">10°</text><line x1="240" y1="420" x2="240" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="324" x2="520" y2="324" stroke="#d3dfe3" stroke-width="2" /><text x="240" y="447" font-size="16" fill="#213e45" text-anchor="middle">20°</text><text x="85" y="329" font-size="16" fill="#213e45" text-anchor="end">20°</text><line x1="310" y1="420" x2="310" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="276" x2="520" y2="276" stroke="#d3dfe3" stroke-width="2" /><text x="310" y="447" font-size="16" fill="#213e45" text-anchor="middle">30°</text><text x="85" y="281" font-size="16" fill="#213e45" text-anchor="end">30°</text><line x1="380" y1="420" x2="380" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="228" x2="520" y2="228" stroke="#d3dfe3" stroke-width="2" /><text x="380" y="447" font-size="16" fill="#213e45" text-anchor="middle">40°</text><text x="85" y="233" font-size="16" fill="#213e45" text-anchor="end">40°</text><line x1="450" y1="420" x2="450" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="180" x2="520" y2="180" stroke="#d3dfe3" stroke-width="2" /><text x="450" y="447" font-size="16" fill="#213e45" text-anchor="middle">50°</text><text x="85" y="185" font-size="16" fill="#213e45" text-anchor="end">50°</text><line x1="520" y1="420" x2="520" y2="132" stroke="#d3dfe3" stroke-width="2" /><line x1="100" y1="132" x2="520" y2="132" stroke="#d3dfe3" stroke-width="2" /><text x="520" y="447" font-size="16" fill="#213e45" text-anchor="middle">60°</text><text x="85" y="137" font-size="16" fill="#213e45" text-anchor="end">60°</text><text x="225" y="474" font-size="18" fill="#213e45" text-anchor="start">Longitude (x) →</text><text x="58" y="122" font-size="18" fill="#213e45" text-anchor="start">Latitude (y)</text><circle cx="134.3021" cy="168.58032" r="8" fill="#23745d" stroke="white" stroke-width="2"/><circle cx="466.6537" cy="396.47856" r="8" fill="#ae521f" stroke="white" stroke-width="2"/><text x="590" y="165" font-size="21" fill="#23745d" text-anchor="start">CORRECT / Amsterdam</text><text x="590" y="198" font-size="21" fill="#213e45" text-anchor="start">x = 4.9003° E</text><text x="590" y="228" font-size="21" fill="#213e45" text-anchor="start">y = 52.3791° N</text><text x="590" y="304" font-size="21" fill="#ae521f" text-anchor="start">SWAPPED / Indian Ocean</text><text x="590" y="337" font-size="21" fill="#213e45" text-anchor="start">x = 52.3791° E</text><text x="590" y="367" font-size="21" fill="#213e45" text-anchor="start">y = 4.9003° N</text><text x="590" y="433" font-size="18" fill="#213e45" text-anchor="start">Both pass global range checks.</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Angular coordinate plot, not a distance-preserving map. GeoJSON order is [longitude, latitude].</text></g></svg>
