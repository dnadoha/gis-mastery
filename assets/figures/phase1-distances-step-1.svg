<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc"><title id="title">Follow the two road legs to Home 1</title><desc id="desc">The road first goes 60 m east, then 80 m north: a 140 m trip. Both axes use the same scale, so the right-angle geometry is meaningful.</desc><rect width="720" height="700" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Follow the two road legs to Home 1</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">25</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">25</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">50</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">50</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">75</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">75</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">100</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">100</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">North of School A (m)</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">East of School A (m)</text><polyline points="100,570 376,570 376,202" fill="none" stroke="#23745d" stroke-width="3" /><line x1="36" y1="664" x2="70" y2="664" stroke="#23745d" stroke-width="2" /><text x="82" y="670" font-size="17" fill="#213e45" text-anchor="start">School (0,0) → (60,0) → Home (60,80)</text></g></svg>
