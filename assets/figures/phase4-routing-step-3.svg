<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">One-way travel can change the cheapest route</title><desc id="desc">The destination and physical road can stay the same while an allowed direction changes. Reachable vertices under a budget still do not define a continuous coverage polygon.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">One-way travel can change the cheapest route</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Both directions</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">S2 at vertex 6</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">6 → 5 reaches I3</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Cost 3</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Only 5 → 6</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Cannot traverse 6 → 5</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Detour 6 → 4 → 5</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Cost 8</text></g></svg>
