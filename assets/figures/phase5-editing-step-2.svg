<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Two clients begin with version 1</title><desc id="desc">A stale editor must reconcile with the current record. Blindly retrying the same change against a fresh version can overwrite a colleague’s intent.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Two clients begin with version 1</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Editor A</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">PATCH id 1, version 1</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Match → update once</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">200 · version becomes 2</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Editor B</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">PATCH id 1, version 1</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">No version match</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">409 · reload and resolve</text></g></svg>
