<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Locate the synthetic elevation footprint</title><desc id="desc">The upper-left origin follows from the lower-left corner plus the raster height. This synthetic DEM has an arbitrary vertical reference, not surveyed elevations.</desc><rect width="720" height="420" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Locate the synthetic elevation footprint</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">RD New metres · north at the top</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">NW: 121000,488000</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">NE: 124000,488000</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">SW: 121000,486000</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">SE: 124000,486000</text><text x="36" y="264" font-size="19" fill="#23745d" text-anchor="start">Grid dimensions</text><rect x="36" y="282" width="646" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="312" font-size="18" fill="#213e45" text-anchor="middle">1200 columns × 2.5 m = 3000 m</text><rect x="36" y="330" width="646" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="360" font-size="18" fill="#213e45" text-anchor="middle">800 rows × 2.5 m = 2000 m</text></g></svg>
