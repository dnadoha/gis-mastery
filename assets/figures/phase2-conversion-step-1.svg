<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">Inspect the parcel baseline before converting</title><desc id="desc">Check these values with the source checker. Clockwise exterior winding concerns a writer convention; it does not alone prove that the polygon is invalid.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Inspect the parcel baseline before converting</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Expected source facts, not a live command log</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">Count</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">3 features</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">West / east</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">4.892 / 4.8945</text><rect x="36" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="244" font-size="18" fill="#213e45" text-anchor="middle">South / north</text><rect x="360" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="244" font-size="18" fill="#213e45" text-anchor="middle">52.3728 / 52.3744</text><rect x="36" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="292" font-size="18" fill="#213e45" text-anchor="middle">Feature 2 exterior</text><rect x="360" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="292" font-size="18" fill="#213e45" text-anchor="middle">Clockwise winding</text></g></svg>
