<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">Answer the recipient’s practical questions</title><desc id="desc">Keep these descriptions aligned with the dataset version. Lineage connects the release to actual source files and conversion commands.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Answer the recipient’s practical questions</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Metadata fields connected to their purpose</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">Title / abstract</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">What is this?</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">Extent / CRS</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">Where and how located?</text><rect x="36" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="244" font-size="18" fill="#213e45" text-anchor="middle">Dates / lineage</text><rect x="360" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="244" font-size="18" fill="#213e45" text-anchor="middle">When and from what?</text><rect x="36" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="292" font-size="18" fill="#213e45" text-anchor="middle">Licence / contact</text><rect x="360" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="292" font-size="18" fill="#213e45" text-anchor="middle">May I use it; who knows?</text></g></svg>
