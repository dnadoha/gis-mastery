<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-labelledby="title desc"><title id="title">Assignment leaves the numbers alone</title><desc id="desc">Both panels contain identical numbers. Documentation establishes their meaning before the CRS label is attached; assignment performs no coordinate calculation.</desc><rect width="720" height="285" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Assignment leaves the numbers alone</text><rect x="32" y="80" width="316" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Before assignment</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">90.4125, 23.8103</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Reference not attached</text><rect x="360" y="80" width="316" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">After verification</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">90.4125, 23.8103</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Label: EPSG:4326</text></g></svg>
