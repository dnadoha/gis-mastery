<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title desc"><title id="title">Flood closure changes the least-cost route</title><desc id="desc">The detour factor is 4250/2250 ≈ 1.889. Costs are metres here, not travel times. A closed clinic connection does not prove every resident in its district is isolated.</desc><rect width="720" height="270" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Flood closure changes the least-cost route</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">Route length (m) · synthetic network</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Before: P1–P2–P4</text><rect x="300" y="112" width="169.41176470588232" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">2250</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">After: P1–P3–N–P4</text><rect x="300" y="172" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">4250</text><line x1="300" y1="105" x2="300" y2="228" stroke="#213e45" stroke-width="2" /><text x="300" y="252" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="252" font-size="15" fill="#213e45" text-anchor="end">4250</text></g></svg>
