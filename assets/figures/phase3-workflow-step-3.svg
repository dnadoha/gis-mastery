<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Describe what the population estimate assumes</title><desc id="desc">5000/12000 ≈ 41.7% depends on uniform within-district density. Agreement between raster and vector area here also depends on the aligned grid boundaries.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Describe what the population estimate assumes</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">Residents in the synthetic fixture</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Estimated exposed</text><rect x="300" y="112" width="133.33333333333337" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">5000</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Estimated not exposed</text><rect x="300" y="172" width="186.66666666666669" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">7000</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Total population</text><rect x="300" y="232" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">12000</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">12000</text></g></svg>
