<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="title desc"><title id="title">Named fields prevent swapped coordinates</title><desc id="desc">The table labels longitude and latitude explicitly. A format’s order still matters even when the CRS definition lists its axes in another order.</desc><rect width="720" height="256" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Named fields prevent swapped coordinates</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">School A · documented as EPSG:4326</text><rect x="36" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="148" font-size="18" fill="#213e45" text-anchor="middle">name</text><rect x="252" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">lon</text><rect x="468" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="148" font-size="18" fill="#213e45" text-anchor="middle">lat</text><rect x="36" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="196" font-size="18" fill="#213e45" text-anchor="middle">School A</text><rect x="252" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="196" font-size="18" fill="#213e45" text-anchor="middle">90.4125</text><rect x="468" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="196" font-size="18" fill="#213e45" text-anchor="middle">23.8103</text></g></svg>
