<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Mercator stretches local map distances</title><desc id="desc">At 60° latitude, a small ground segment appears about twice as long in spherical Mercator coordinates. Metre units alone do not make a projection suitable for local measurement.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Mercator stretches local map distances</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">Map length / ground length · spherical approximation</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Equator: 0°</text><rect x="300" y="112" width="160" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">1</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Latitude 30°</text><rect x="300" y="172" width="184.8" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">1.155</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Latitude 60°</text><rect x="300" y="232" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">2</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">2</text></g></svg>
