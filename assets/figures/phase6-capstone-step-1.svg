<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Steps 1–3 · observations to change map</title><desc id="desc">Start with a small sub-AOI to verify one pixel by hand. Keep cloud-masked area distinct from observed no-change area.</desc><rect width="720" height="520" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Steps 1–3 · observations to change map</text><rect x="64" y="80" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="106" font-size="19" fill="#213e45" text-anchor="start">AOI + same-season windows → STAC items</text><line x1="360" y1="143" x2="360" y2="160" stroke="#23745d" stroke-width="2" /><path d="M354 154L360 161L366 154" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="164" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="190" font-size="19" fill="#213e45" text-anchor="start">Per-scene calibration, masks and alignment</text><line x1="360" y1="227" x2="360" y2="244" stroke="#23745d" stroke-width="2" /><path d="M354 238L360 245L366 238" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="248" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="274" font-size="19" fill="#213e45" text-anchor="start">Year A / year B median composites</text><line x1="360" y1="311" x2="360" y2="328" stroke="#23745d" stroke-width="2" /><path d="M354 322L360 329L366 322" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="332" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="358" font-size="19" fill="#213e45" text-anchor="start">ΔNDVI + dNBR → threshold + mapping unit</text><line x1="360" y1="395" x2="360" y2="412" stroke="#23745d" stroke-width="2" /><path d="M354 406L360 413L366 406" fill="none" stroke="#23745d" stroke-width="2"/><rect x="64" y="416" width="592" height="62" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="86" y="442" font-size="19" fill="#213e45" text-anchor="start">Change raster + mapped area</text></g></svg>
