<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Choose the spatial measurement model first</title><desc id="desc">The type and CRS determine the calculation model. A geometry in EPSG:4326 uses degree coordinates, even though geography distances can be reported in metres.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Choose the spatial measurement model first</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">geometry</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Planar calculations</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Units from the CRS</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Local EPSG:28992 metres</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">geography</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Earth-surface calculations</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Distances in metres</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Spheroidal measurements</text></g></svg>
