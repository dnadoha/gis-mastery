<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">Spatial join rows depend on the predicate</title><desc id="desc">A left join retains an unmatched clinic with null district attributes. An inclusive boundary predicate can return two matches, so inspect row counts.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Spatial join rows depend on the predicate</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Illustrative positions relative to two districts</text><rect x="36" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="148" font-size="18" fill="#213e45" text-anchor="middle">Point</text><rect x="252" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">within</text><rect x="468" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="148" font-size="18" fill="#213e45" text-anchor="middle">intersects</text><rect x="36" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="196" font-size="18" fill="#213e45" text-anchor="middle">Inside A</text><rect x="252" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="196" font-size="18" fill="#213e45" text-anchor="middle">A</text><rect x="468" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="196" font-size="18" fill="#213e45" text-anchor="middle">A</text><rect x="36" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="244" font-size="18" fill="#213e45" text-anchor="middle">On shared edge</text><rect x="252" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="244" font-size="18" fill="#213e45" text-anchor="middle">Neither</text><rect x="468" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="244" font-size="18" fill="#213e45" text-anchor="middle">A and B</text><rect x="36" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="292" font-size="18" fill="#213e45" text-anchor="middle">Outside both</text><rect x="252" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="292" font-size="18" fill="#213e45" text-anchor="middle">No match</text><rect x="468" y="262" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="292" font-size="18" fill="#213e45" text-anchor="middle">No match</text></g></svg>
