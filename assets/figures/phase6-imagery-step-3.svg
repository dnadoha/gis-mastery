<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">The same DN pair, different NDVI if mis-scaled</title><desc id="desc">A common multiplicative factor cancels in NDVI; an additive offset does not. Harmonised catalogs may already adjust offsets—do not apply them twice.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">The same DN pair, different NDVI if mis-scaled</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Correct metadata</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Red: (1500−1000)/10000</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">NIR: (4800−1000)/10000</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">NDVI ≈ 0.767</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Offset forgotten</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Red: 1500/10000</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">NIR: 4800/10000</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">NDVI ≈ 0.524</text></g></svg>
