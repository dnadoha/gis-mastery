<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">The closure rule distinguishes touch from crossing</title><desc id="desc">The positive-length rule is an explicit modelling choice. Retain isolated nodes after removing closed edges so loss of access remains visible.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">The closure rule distinguishes touch from crossing</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Point-only touch</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Intersection length = 0</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Road remains open</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Under this exercise rule</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Flooded segment</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Intersection length &gt; 0</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Road is closed</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">R12, R23, R24 close</text></g></svg>
