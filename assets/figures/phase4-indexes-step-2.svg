<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Keep the indexed column usable</title><desc id="desc">The planner needs an index expression compatible with the predicate. Wrapping every stored geometry in a transformation can bypass an ordinary geom index.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Keep the indexed column usable</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Ordinary geom index</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Transform the query constant</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Use ST_DWithin for radius</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">ANALYZE after bulk load</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Transformed column</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Expression in WHERE</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Needs matching index</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Or indexed display copy</text></g></svg>
