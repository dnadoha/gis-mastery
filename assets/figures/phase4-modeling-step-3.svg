<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Shared topology and simple features differ</title><desc id="desc">A shared topology model makes relationships explicit but has its own editing workflow. Derived display layers still need a documented refresh policy and regression checks.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Shared topology and simple features differ</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Simple features</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Each polygon stores coordinates</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Audit matching edges</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Enforce coverage rules</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Topology model</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Shared nodes, edges, faces</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">One shared boundary record</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Faces reference common edges</text></g></svg>
