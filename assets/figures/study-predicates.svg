<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Spatial predicates describe different relationships</title><desc id="desc">Two polygons are disjoint, share only an edge, overlap in area, or one is strictly inside the other. Touching and within also imply intersects.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Spatial predicates describe different relationships</text><rect x="32" y="110" width="440" height="178" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="52" y="140" font-size="22" fill="#213e45" text-anchor="start">Disjoint</text><rect x="212" y="175" width="60" height="60" fill="#a5cee080" stroke="#246eab" stroke-width="2"/><rect x="87" y="175" width="90" height="60" fill="#b4d8bf90" stroke="#23745d" stroke-width="2"/><text x="95" y="209" font-size="19" fill="#23745d" text-anchor="start">A</text><text x="251" y="226" font-size="19" fill="#246eab" text-anchor="start">B</text><text x="262" y="270" font-size="18" fill="#213e45" text-anchor="start">intersects = false</text><rect x="488" y="110" width="440" height="178" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="508" y="140" font-size="22" fill="#213e45" text-anchor="start">Touching</text><rect x="633" y="175" width="60" height="60" fill="#a5cee080" stroke="#246eab" stroke-width="2"/><rect x="543" y="175" width="90" height="60" fill="#b4d8bf90" stroke="#23745d" stroke-width="2"/><text x="551" y="209" font-size="19" fill="#23745d" text-anchor="start">A</text><text x="672" y="226" font-size="19" fill="#246eab" text-anchor="start">B</text><text x="718" y="270" font-size="18" fill="#213e45" text-anchor="start">touches = true</text><rect x="32" y="302" width="440" height="178" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="52" y="332" font-size="22" fill="#213e45" text-anchor="start">Overlapping</text><rect x="147" y="392" width="60" height="60" fill="#a5cee080" stroke="#246eab" stroke-width="2"/><rect x="87" y="367" width="90" height="60" fill="#b4d8bf90" stroke="#23745d" stroke-width="2"/><text x="95" y="401" font-size="19" fill="#23745d" text-anchor="start">A</text><text x="186" y="443" font-size="19" fill="#246eab" text-anchor="start">B</text><text x="262" y="462" font-size="18" fill="#213e45" text-anchor="start">overlaps = true</text><rect x="488" y="302" width="440" height="178" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="508" y="332" font-size="22" fill="#213e45" text-anchor="start">A within B</text><rect x="533" y="357" width="110" height="100" fill="#a5cee080" stroke="#246eab" stroke-width="2"/><rect x="543" y="367" width="60" height="60" fill="#b4d8bf90" stroke="#23745d" stroke-width="2"/><text x="551" y="401" font-size="19" fill="#23745d" text-anchor="start">A</text><text x="622" y="448" font-size="19" fill="#246eab" text-anchor="start">B</text><text x="718" y="462" font-size="18" fill="#213e45" text-anchor="start">within = true</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Synthetic planar polygons. Touch, overlap and within all intersect; within does not imply overlaps.</text></g></svg>
