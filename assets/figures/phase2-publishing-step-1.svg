<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc"><title id="title">Three contracts in a publishing system</title><desc id="desc">The columns solve different problems. A readable file, a working endpoint and an informative metadata record are complementary parts of a release.</desc><rect width="720" height="310" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Three contracts in a publishing system</text><rect x="32" y="80" width="206.66666666666666" height="210" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Storage</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">GeoPackage</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">How are bytes</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">stored?</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="210" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Delivery</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">WFS / OGC API</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">How do I request</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">data?</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Discovery</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Metadata record</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">What does it mean?</text></g></svg>
