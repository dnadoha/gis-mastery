<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">One degree is not a fixed ground distance</title><desc id="desc">WGS 84 latitude-degree lengths remain near 111 km. Longitude-degree lengths fall from 111.32 km at the equator to 55.80 km at 60 degrees.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">One degree is not a fixed ground distance</text><rect x="32" y="110" width="896" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="60" y="145" font-size="19" fill="#213e45" text-anchor="start">Latitude</text><text x="210" y="145" font-size="19" fill="#213e45" text-anchor="start">One degree: local ground length (km)</text><text x="65" y="210" font-size="24" fill="#213e45" text-anchor="start">0°</text><rect x="210" y="185" width="442.29710328637736" height="22" fill="#23745d" stroke="none" stroke-width="2"/><rect x="210" y="215" width="445.27796317309424" height="22" fill="#246eab" stroke="none" stroke-width="2"/><text x="680" y="203" font-size="18" fill="#23745d" text-anchor="start">110.57 km latitude</text><text x="680" y="233" font-size="18" fill="#246eab" text-anchor="start">111.32 km longitude</text><text x="65" y="304" font-size="24" fill="#213e45" text-anchor="start">30°</text><rect x="210" y="279" width="443.40976998246833" height="22" fill="#23745d" stroke="none" stroke-width="2"/><rect x="210" y="309" width="385.94512100358605" height="22" fill="#246eab" stroke="none" stroke-width="2"/><text x="680" y="297" font-size="18" fill="#23745d" text-anchor="start">110.85 km latitude</text><text x="680" y="327" font-size="18" fill="#246eab" text-anchor="start">96.49 km longitude</text><text x="65" y="398" font-size="24" fill="#213e45" text-anchor="start">60°</text><rect x="210" y="373" width="445.64914983111765" height="22" fill="#23745d" stroke="none" stroke-width="2"/><rect x="210" y="403" width="223.20000628974458" height="22" fill="#246eab" stroke="none" stroke-width="2"/><text x="680" y="391" font-size="18" fill="#23745d" text-anchor="start">111.41 km latitude</text><text x="680" y="421" font-size="18" fill="#246eab" text-anchor="start">55.80 km longitude</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">WGS 84 local curvature × π/180; differential lengths, not finite one-degree endpoint geodesics.</text></g></svg>
