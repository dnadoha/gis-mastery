<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">Combine sums and counts, not block means</title><desc id="desc">The correct mean is (20+240)/(2+8)=26. Averaging 10 and 30 gives 20 because it incorrectly assigns equal weight to the unequal blocks.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Combine sums and counts, not block means</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Illustration with unequal valid counts</text><rect x="36" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="148" font-size="18" fill="#213e45" text-anchor="middle">Block</text><rect x="198" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="148" font-size="18" fill="#213e45" text-anchor="middle">Count</text><rect x="360" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="148" font-size="18" fill="#213e45" text-anchor="middle">Sum</text><rect x="522" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="148" font-size="18" fill="#213e45" text-anchor="middle">Mean</text><rect x="36" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="196" font-size="18" fill="#213e45" text-anchor="middle">A</text><rect x="198" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="196" font-size="18" fill="#213e45" text-anchor="middle">2</text><rect x="360" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="196" font-size="18" fill="#213e45" text-anchor="middle">20</text><rect x="522" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="196" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="36" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="244" font-size="18" fill="#213e45" text-anchor="middle">B</text><rect x="198" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="244" font-size="18" fill="#213e45" text-anchor="middle">8</text><rect x="360" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="244" font-size="18" fill="#213e45" text-anchor="middle">240</text><rect x="522" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="244" font-size="18" fill="#213e45" text-anchor="middle">30</text><rect x="36" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="292" font-size="18" fill="#213e45" text-anchor="middle">Combined</text><rect x="198" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="292" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="360" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="292" font-size="18" fill="#213e45" text-anchor="middle">260</text><rect x="522" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="292" font-size="18" fill="#213e45" text-anchor="middle">26</text></g></svg>
