<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-labelledby="title desc"><title id="title">Choose the delivery by the reader’s job</title><desc id="desc">These strengths are different access contracts, not a universal ranking. Keep the authoritative master when deriving a specialised delivery.</desc><rect width="720" height="382" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Choose the delivery by the reader’s job</text><rect x="32" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">GeoJSON</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Small web payload</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Readable text</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Fixed geographic CRS</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="282" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">FlatGeobuf</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Spatial subset reads</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Optional packed</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">index</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">Range-friendly</text><text x="264.66666666666663" y="305" font-size="18" fill="#213e45" text-anchor="start">layout</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">KML / GML</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">KML: presentation</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">GML: schema-rich</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">exchange</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">Check client support</text></g></svg>
