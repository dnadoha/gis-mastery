<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Surface minus terrain gives relative height</title><desc id="desc">Do not turn a void into zero height. Many large negative differences indicate alignment or classification problems; clamping is not a repair.</desc><rect width="720" height="400" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Surface minus terrain gives relative height</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Illustrative DSM / DTM / difference</text><rect x="36" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="148" font-size="18" fill="#213e45" text-anchor="middle">Cell</text><rect x="198" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="148" font-size="18" fill="#213e45" text-anchor="middle">DSM m</text><rect x="360" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="148" font-size="18" fill="#213e45" text-anchor="middle">DTM m</text><rect x="522" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="148" font-size="18" fill="#213e45" text-anchor="middle">Height m</text><rect x="36" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="196" font-size="18" fill="#213e45" text-anchor="middle">Tree</text><rect x="198" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="196" font-size="18" fill="#213e45" text-anchor="middle">120</text><rect x="360" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="196" font-size="18" fill="#213e45" text-anchor="middle">100</text><rect x="522" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="196" font-size="18" fill="#213e45" text-anchor="middle">20</text><rect x="36" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="244" font-size="18" fill="#213e45" text-anchor="middle">Roof</text><rect x="198" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="244" font-size="18" fill="#213e45" text-anchor="middle">108</text><rect x="360" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="244" font-size="18" fill="#213e45" text-anchor="middle">100</text><rect x="522" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="244" font-size="18" fill="#213e45" text-anchor="middle">8</text><rect x="36" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="292" font-size="18" fill="#213e45" text-anchor="middle">Road</text><rect x="198" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="292" font-size="18" fill="#213e45" text-anchor="middle">100</text><rect x="360" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="292" font-size="18" fill="#213e45" text-anchor="middle">100</text><rect x="522" y="262" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="292" font-size="18" fill="#213e45" text-anchor="middle">0</text><rect x="36" y="310" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="340" font-size="18" fill="#213e45" text-anchor="middle">Void</text><rect x="198" y="310" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="340" font-size="18" fill="#213e45" text-anchor="middle">NoData</text><rect x="360" y="310" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="340" font-size="18" fill="#213e45" text-anchor="middle">100</te