<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Keep each number in its named field</title><desc id="scene-desc">Both fields describe the same invented School A. Axis order is the required order of the numbers.</desc><rect width="960" height="540" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="33" font-size="14" fill="#284c40" text-anchor="start">OUR NEIGHBOURHOOD / SAME PROJECT, NEXT STEP</text><text x="32" y="75" font-size="25" fill="#284c40" text-anchor="start">Keep each number in its named field</text><rect x="55" y="125" width="405" height="145" rx="4" fill="#fbf1e7" stroke="#dec4ae"/><text x="80" y="163" font-size="24" fill="#a65d27" text-anchor="start">longitude</text><text x="80" y="207" font-size="32" fill="#a65d27" text-anchor="start">90.4125</text><text x="80" y="245" font-size="18" fill="#284c40" text-anchor="start">East / west · degrees</text><rect x="500" y="125" width="405" height="145" rx="4" fill="#edf5fa" stroke="#b8d2e1"/><text x="525" y="163" font-size="24" fill="#256996" text-anchor="start">latitude</text><text x="525" y="207" font-size="32" fill="#256996" text-anchor="start">23.8103</text><text x="525" y="245" font-size="18" fill="#284c40" text-anchor="start">North / south · degrees</text><path d="M258 270L258 322" stroke="#a65d27" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M250 312L258 322" stroke="#a65d27" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M266 312L258 322" stroke="#a65d27" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M703 270L703 322" stroke="#256996" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M695 312L703 322" stroke="#256996" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M711 312L703 322" stroke="#256996" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="105" y="325" width="750" height="105" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="480" y="356" font-size="17" fill="#284c40" text-anchor="middle">WHEN THE TOOL ASKS FOR LONGITUDE FIRST</text><text x="210" y="401" font-size="32" fill="#284c40" text-anchor="start">[</text><text x="260" y="401" font-size="32" fill="#a65d27" text-anchor="start">90.4125</text><text x="476" y="401" font-size="32" fill="#284c40" text-anchor="start">,</text><text x="590" y="401" font-size="32" fill="#256996" text-anchor="start">23.8103</text><text x="790" y="401" font-size="32" fill="#284c40" text-anchor="start">]</text><text x="480" y="474" font-size="20" fill="#284c40" text-anchor="middle">Always read the field names: another tool may ask for latitude first.</text><text x="32" y="514" font-size="15" fill="#284c40" text-anchor="start">Both fields describe the same invented School A. Axis order is the required order of the numbers.</text></g></svg>
