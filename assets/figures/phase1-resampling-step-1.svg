<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="title desc"><title id="title">Four population cells cover one larger cell</title><desc id="desc">The panels represent the same footprint despite their schematic display sizes. The people stay in place while the storage grid changes.</desc><rect width="720" height="372" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Four population cells cover one larger cell</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Before · four 100 × 100 m cells</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">10</text><text x="36" y="264" font-size="19" fill="#23745d" text-anchor="start">After · one 200 × 200 m cell</text><rect x="36" y="282" width="646" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="312" font-size="18" fill="#213e45" text-anchor="middle">Same land · 40 people</text></g></svg>
