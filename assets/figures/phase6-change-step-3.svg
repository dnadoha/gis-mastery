<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Averaging 0.01 and 0.10 backscatter</title><desc id="desc">The arithmetic mean in linear units is 0.055, about −12.60 dB. Averaging the logarithms instead gives −15 dB, a different quantity.</desc><rect width="720" height="390" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Averaging 0.01 and 0.10 backscatter</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">dB</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">First observation</text><rect x="300" y="112" width="320" height="34" rx="5" fill="#c4d9ef" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">-20</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Second observation</text><rect x="460" y="172" width="160" height="34" rx="5" fill="#c4d9ef" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">-10</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Correct: 10 log10(0.055)</text><rect x="418.464" y="232" width="201.536" height="34" rx="5" fill="#c4d9ef" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">-12.596</text><text x="36" y="315" font-size="17" fill="#213e45" text-anchor="start">Incorrect: mean of dB</text><rect x="380" y="292" width="240" height="34" rx="5" fill="#c4d9ef" stroke="none"/><text x="674" y="315" font-size="17" fill="#213e45" text-anchor="end">-15</text><line x1="620" y1="105" x2="620" y2="348" stroke="#213e45" stroke-width="2" /><text x="300" y="372" font-size="15" fill="#213e45" text-anchor="start">-20</text><text x="620" y="372" font-size="15" fill="#213e45" text-anchor="end">0</text></g></svg>
