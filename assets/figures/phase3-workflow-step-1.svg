<svg xmlns="http://www.w3.org/2000/svg" width="720" height="802" viewBox="0 0 720 802" role="img" aria-labelledby="title desc"><title id="title">Lay out the flood study in local coordinates</title><desc id="desc">A, B and C are each 1000 m squares on equal-scale axes. The shaded flood covers half of A and half of B. Coordinates are offsets from the UTM origin (500000,5700000).</desc><rect width="720" height="802" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Lay out the flood study in local coordinates</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">500</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">500</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">1000</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">1000</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">1500</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">1500</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">2000</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">2000</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">North of study origin (m)</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">East of study origin (m)</text><polyline points="100,570 330,570 330,340 100,340 100,570" fill="#e1efe5" stroke="#23745d" stroke-width="3" /><line x1="36" y1="664" x2="70" y2="664" stroke="#23745d" stroke-width="2" /><text x="82" y="670" font-size="17" fill="#213e45" text-anchor="start">District A · 1000 × 1000 m</text><polyline points="330,570 560,570 560,340 330,340 330,570" fill="#f5e7d5" stroke="#ae521f" stroke-width="3" stroke-dasharray="8 4"/><line x1="36" y1="698" x2="70" y2="698" stroke="#ae521f" stroke-width="2" stroke-dasharray="8 4"/><text x="82" y="704" font-size="17" fill="#213e45" text-anchor="start">District B · 1000 × 1000 m</text><polyline points="100,340 330,340 330,110 100,110 100,340" fill="#e6ecf5" stroke="#246eab" stroke-width="3" stroke-dasharray="8 4"/><line x1="36" y1="732" x2="70" y2="732" stroke="#246eab" stroke-width="2" stroke-dasharray="8 4"/><text x="82" y="738" font-size="17" fill="#213e45" text-anchor="start">District C · 1000 × 1000 m</text><polyline points="215,570 445,570 445,340 215,340 215,570" fill="#93c5e480" stroke="#8257a1" stroke-width="3" stroke-dasharray="8 4"/><line x1="36" y1="766" x2="70" y2="766" stroke="#8257a1" stroke-width="2" stroke-dasharray="8 4"/><text x="82" y="772" font-size="17" fill="#213e45" text-anchor="start">Flood · x=500…1500, y=0…1000</text></g></svg>
