<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Assign a CRS label or transform the coordinates?</title><desc id="desc">Assigning verified WGS 84 metadata keeps the coordinate numbers. Transforming Amsterdam to UTM zone 31N changes numbers and units while keeping the place.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Assign a CRS label or transform the coordinates?</text><rect x="32" y="110" width="896" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="60" y="153" font-size="22" fill="#213e45" text-anchor="start">Verified source: Amsterdam, WGS 84, conventional x/y order</text><rect x="60" y="185" width="295" height="82" fill="#e1eee8" stroke="none" stroke-width="2"/><text x="80" y="220" font-size="25" fill="#213e45" text-anchor="start">4.9003, 52.3791</text><text x="80" y="250" font-size="17" fill="#213e45" text-anchor="start">longitude, latitude / degrees</text><line x1="375" y1="225" x2="490" y2="225" stroke="#213e45" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(490 225) rotate(0)" fill="none" stroke="#213e45" stroke-width="2"/><text x="386" y="207" font-size="18" fill="#213e45" text-anchor="start">assign</text><text x="520" y="215" font-size="25" fill="#213e45" text-anchor="start">4.9003, 52.3791</text><text x="520" y="249" font-size="18" fill="#213e45" text-anchor="start">EPSG:4326 label added; values stay</text><line x1="205" y1="285" x2="205" y2="350" stroke="#213e45" stroke-width="2" /><path d="M-9 -5L0 0L-9 5" transform="translate(205 350) rotate(90)" fill="none" stroke="#213e45" stroke-width="2"/><text x="225" y="325" font-size="18" fill="#213e45" text-anchor="start">transform</text><rect x="60" y="365" width="800" height="77" fill="#e0edf6" stroke="none" stroke-width="2"/><text x="80" y="398" font-size="25" fill="#246eab" text-anchor="start">629345.7 m E, 5804903.4 m N</text><text x="80" y="427" font-size="19" fill="#213e45" text-anchor="start">EPSG:32631 / UTM 31N / same physical place</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Computed with WGS 84 sixth-order Krüger UTM. Relabelling degree values as metres is not reprojection.</text></g></svg>
