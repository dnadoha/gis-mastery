<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Similar APIs do not imply identical engines</title><desc id="desc">Turf is not a GEOS binding, and proj4js does not reproduce all of PROJ’s operation database. Compare results on known points before porting a workflow.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Similar APIs do not imply identical engines</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Browser tools</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">proj4js projections</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Turf geometry operations</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Check supported algorithms</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Native workflow</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">PROJ operations and grids</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">GEOS geometry algorithms</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Use for required accuracy</text></g></svg>
