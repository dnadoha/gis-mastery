<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Labelling and transforming are separate actions</title><desc id="desc">The synthetic flood study starts at UTM 31N easting 500000, northing 5700000. Attaching metadata cannot fix coordinates that were already misinterpreted.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Labelling and transforming are separate actions</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">set_crs</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Attach verified meaning</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Numbers unchanged</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">No geometry movement</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">to_crs</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Calculate target values</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Known source required</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Same physical location</text></g></svg>
