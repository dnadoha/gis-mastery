<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" role="img" aria-labelledby="title desc"><title id="title">Test I2 against either adjacent district</title><desc id="desc">For this polygon–point relationship, ST_Relate returns FF20F1FF2. The empty interior/interior intersection explains why Contains excludes I2.</desc><rect width="720" height="416" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Test I2 against either adjacent district</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Boundary-only point · district first, point second</text><rect x="36" y="118" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="156" font-size="18" fill="#213e45" text-anchor="middle">Predicate</text><rect x="252" y="118" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="156" font-size="18" fill="#213e45" text-anchor="middle">Result</text><rect x="468" y="118" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="156" font-size="18" fill="#213e45" text-anchor="middle">Reason</text><rect x="36" y="182" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="220" font-size="18" fill="#213e45" text-anchor="middle">Contains</text><rect x="252" y="182" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="220" font-size="18" fill="#213e45" text-anchor="middle">False</text><rect x="468" y="182" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="208" font-size="18" fill="#213e45" text-anchor="middle">Not in polygon</text><text x="576" y="232" font-size="18" fill="#213e45" text-anchor="middle">interior</text><rect x="36" y="246" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="284" font-size="18" fill="#213e45" text-anchor="middle">Covers</text><rect x="252" y="246" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="284" font-size="18" fill="#213e45" text-anchor="middle">True</text><rect x="468" y="246" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="284" font-size="18" fill="#213e45" text-anchor="middle">Boundary is included</text><rect x="36" y="310" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="348" font-size="18" fill="#213e45" text-anchor="middle">Intersects</text><rect x="252" y="310" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="348" font-size="18" fill="#213e45" text-anchor="middle">True</text><rect x="468" y="310" width="214" height="62" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="348" font-size="18" fill="#213e45" text-anchor="middle">They share a point</text></g></svg>
