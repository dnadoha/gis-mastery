<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-labelledby="title desc"><title id="title">Threshold equality changes one result pair</title><desc id="desc">ST_DWithin includes equality. Replacing a strict distance predicate without preserving its strict test changes the total from three pairs to four.</desc><rect width="720" height="304" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Threshold equality changes one result pair</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Station counts · the S1–I2 distance is exactly 2000 m</text><rect x="36" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="148" font-size="18" fill="#213e45" text-anchor="middle">Query rule</text><rect x="198" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="148" font-size="18" fill="#213e45" text-anchor="middle">S1</text><rect x="360" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="148" font-size="18" fill="#213e45" text-anchor="middle">S2</text><rect x="522" y="118" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="148" font-size="18" fill="#213e45" text-anchor="middle">S3</text><rect x="36" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="196" font-size="18" fill="#213e45" text-anchor="middle">Distance &lt; 2000</text><rect x="198" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="196" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="360" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="196" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="522" y="166" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="196" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="36" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="117" y="244" font-size="18" fill="#213e45" text-anchor="middle">DWithin 2000</text><rect x="198" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="279" y="244" font-size="18" fill="#213e45" text-anchor="middle">2</text><rect x="360" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="441" y="244" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="522" y="214" width="160" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="603" y="244" font-size="18" fill="#213e45" text-anchor="middle">1</text></g></svg>
