<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Range access needs a working HTTP contract</title><desc id="desc">Inspect the actual response from the deployed URL. A server returning the entire object with 200 can defeat selective reads even when the file layout is correct.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Range access needs a working HTTP contract</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Client requests</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Range: bytes=a-b</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Browser checks CORS</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Then decodes the block</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Host must deliver</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">206 Partial Content</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Correct Content-Range</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Access permitted by CORS</text></g></svg>
