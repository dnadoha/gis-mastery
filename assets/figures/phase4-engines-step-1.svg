<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Concurrency helps choose the storage model</title><desc id="desc">GeoPackage standardises the container and metadata; the application or extension supplies query functions. It is not a guarantee of every SpatiaLite or PostGIS capability.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Concurrency helps choose the storage model</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Shared server</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">PostGIS</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Many transactional users</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Managed database service</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Embedded file</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">SpatiaLite / GeoPackage</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Offline exchange</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Usually one SQLite writer</text></g></svg>
