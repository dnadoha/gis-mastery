<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372" role="img" aria-labelledby="title desc"><title id="title">The XYZ pyramid</title><desc id="desc">Cell labels are x/y. Columns run right; rows run down. At z = 2 the same world contains a 4 × 4 grid.</desc><rect width="720" height="372" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">The XYZ pyramid</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">z = 0 · 1 tile</text><rect x="36" y="118" width="646" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">0/0</text><text x="36" y="216" font-size="19" fill="#23745d" text-anchor="start">z = 1 · 4 tiles</text><rect x="36" y="234" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="264" font-size="18" fill="#213e45" text-anchor="middle">0/0</text><rect x="360" y="234" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="264" font-size="18" fill="#213e45" text-anchor="middle">1/0</text><rect x="36" y="282" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="312" font-size="18" fill="#213e45" text-anchor="middle">0/1</text><rect x="360" y="282" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="312" font-size="18" fill="#213e45" text-anchor="middle">1/1</text></g></svg>
