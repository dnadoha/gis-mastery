<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc"><title id="title">The instruction sheet for a coordinate</title><desc id="desc">These parts work together as a coordinate reference system. The pair of numbers alone does not specify its reference, directions or units.</desc><rect width="720" height="310" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">The instruction sheet for a coordinate</text><rect x="32" y="80" width="206.66666666666666" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Reference</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">WGS 84</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Which Earth model?</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="185" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Axes</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Latitude / longitude</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Which directions?</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="210" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Units</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Degrees</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">What do numbers</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">mean?</text></g></svg>
