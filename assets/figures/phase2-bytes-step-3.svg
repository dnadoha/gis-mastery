<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">A local geometry is not a whole archive</title><desc id="desc">A decoded command stream is not a complete protobuf tile, and an archive directory is not geometry. Neither restores the original full-resolution analysis features.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A local geometry is not a whole archive</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">MVT geometry</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Integer cursor deltas</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Extent-relative x/y</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Clipped display shapes</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">PMTiles archive</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Directory + complete tiles</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Byte-range retrieval</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Many z/x/y addresses</text></g></svg>
