<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">The same distance call can expect different units</title><desc id="desc">Library names do not replace a coordinate contract. Verify the installed Turf major version as well as the geometry input and distance options.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">The same distance call can expect different units</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Turf</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Geographic GeoJSON</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Longitude first</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Explicit distance unit</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Shapely</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Planar coordinates</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Units come from CRS</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">No automatic degree→metre</text></g></svg>
