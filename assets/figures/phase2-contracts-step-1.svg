<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc"><title id="title">Where does the CRS contract live?</title><desc id="desc">Look in the correct place for each format. A missing declaration in one container cannot be replaced by assumptions borrowed from another.</desc><rect width="720" height="310" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Where does the CRS contract live?</text><rect x="32" y="80" width="206.66666666666666" height="210" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">GeoPackage</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">CRS registry tables</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Layer references its</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">SRS</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="210" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Shapefile</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Companion .prj file</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Missing does not</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">mean WGS 84</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="210" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">GeoJSON</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">RFC 7946 fixed rule</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">WGS 84 longitude,</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">latitude</text></g></svg>
