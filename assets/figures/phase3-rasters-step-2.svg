<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Classification carries the validity mask</title><desc id="desc">These illustrative cells show the threshold boundaries. Class zero means missing data, not low elevation. The flood subset’s actual checkpoint is 100 valid cells with mean 19.5.</desc><rect width="720" height="420" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Classification carries the validity mask</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Example valid elevations and one missing cell</text><rect x="36" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="148" font-size="18" fill="#213e45" text-anchor="middle">14</text><rect x="252" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">15</text><rect x="468" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="148" font-size="18" fill="#213e45" text-anchor="middle">19</text><rect x="36" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="196" font-size="18" fill="#213e45" text-anchor="middle">20</text><rect x="252" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="196" font-size="18" fill="#213e45" text-anchor="middle">24</text><rect x="468" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="196" font-size="18" fill="#213e45" text-anchor="middle">NoData</text><text x="36" y="264" font-size="19" fill="#23745d" text-anchor="start">Class codes · &lt;15, 15…&lt;20, ≥20</text><rect x="36" y="282" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="312" font-size="18" fill="#213e45" text-anchor="middle">1</text><rect x="252" y="282" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="312" font-size="18" fill="#213e45" text-anchor="middle">2</text><rect x="468" y="282" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="312" font-size="18" fill="#213e45" text-anchor="middle">2</text><rect x="36" y="330" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="360" font-size="18" fill="#213e45" text-anchor="middle">3</text><rect x="252" y="330" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="360" font-size="18" fill="#213e45" text-anchor="middle">3</text><rect x="468" y="330" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="360" font-size="18" fill="#213e45" text-anchor="middle">0</text></g></svg>
