<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">Three observation systems</title><desc id="desc">These sensors measure different physical responses. Similar pixel spacing does not guarantee similar effective resolution or information.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Three observation systems</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Optical</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Sun → surface →</text><text x="46" y="186" font-size="18" fill="#213e45" text-anchor="start">sensor</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">Red / NIR / SWIR</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Cloud-sensitive</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">SAR</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Radar pulse and</text><text x="264.66666666666663" y="186" font-size="18" fill="#213e45" text-anchor="start">backscatter</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">VV / VH, geometry</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">Night and cloud</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">LiDAR</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Laser pulse travel</text><text x="483.3333333333333" y="186" font-size="18" fill="#213e45" text-anchor="start">time</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">3D returns</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">Vertical structure</text></g></svg>
