<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Matches are not automatically unique incidents</title><desc id="desc">Contains loses the boundary incident; inclusive predicates match it twice. Covers plus the smallest district_id tie rule assigns all three incidents once in this fixture.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Matches are not automatically unique incidents</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">Total district–incident matches</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Contains</text><rect x="300" y="112" width="160" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">2</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Intersects / Covers</text><rect x="300" y="172" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">4</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Declared one-owner rule</text><rect x="300" y="232" width="240" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">3</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">4</text></g></svg>
