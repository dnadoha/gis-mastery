<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-labelledby="title desc"><title id="title">Join, clip and overlay preserve different things</title><desc id="desc">Choose an operation by the question. Flooded catchment area requires cut geometry, while attaching a district name does not require changing a clinic point.</desc><rect width="720" height="382" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Join, clip and overlay preserve different things</text><rect x="32" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Spatial join</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Attach attributes</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Keep input shapes</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">May multiply rows</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Clip</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Cut input geometry</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Keep input</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">attributes</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">Use mask footprint</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="282" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Overlay</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Partition shared</text><text x="483.3333333333333" y="186" font-size="18" fill="#213e45" text-anchor="start">space</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">Attributes from both</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">New pieces to</text><text x="483.3333333333333" y="305" font-size="18" fill="#213e45" text-anchor="start">measure</text></g></svg>
