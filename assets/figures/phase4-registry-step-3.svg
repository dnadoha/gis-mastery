<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" role="img" aria-labelledby="title desc"><title id="title">The same incident has a different nearest station</title><desc id="desc">S2 moves from x=123000 to x=125000. Historical queries use the version valid at the requested time, preserving yesterday’s answer after today’s relocation.</desc><rect width="720" height="304" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">The same incident has a different nearest station</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">I2 as-of query · S2 moves east on 2026-01-01</text><rect x="36" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="148" font-size="18" fill="#213e45" text-anchor="middle">Query date</text><rect x="252" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="148" font-size="18" fill="#213e45" text-anchor="middle">Nearest</text><rect x="468" y="118" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="148" font-size="18" fill="#213e45" text-anchor="middle">Distance</text><rect x="36" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="196" font-size="18" fill="#213e45" text-anchor="middle">2025-06-01</text><rect x="252" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="196" font-size="18" fill="#213e45" text-anchor="middle">S2</text><rect x="468" y="166" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="196" font-size="18" fill="#213e45" text-anchor="middle">1000 m</text><rect x="36" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="144" y="244" font-size="18" fill="#213e45" text-anchor="middle">2026-06-01</text><rect x="252" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="360" y="244" font-size="18" fill="#213e45" text-anchor="middle">S1</text><rect x="468" y="214" width="214" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="576" y="244" font-size="18" fill="#213e45" text-anchor="middle">2000 m</text></g></svg>
