<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Check the artifact you actually ship</title><desc id="desc">A source fixture is useful for expected values, but it cannot prove the derived artifact is correct. Missing tools or checks must be reported explicitly.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Check the artifact you actually ship</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Insufficient substitute</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Inspect only dem.asc</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Compute theoretical tiles</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Parse abridged XML</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Release evidence</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Open the released COG</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Inspect the actual archive</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Validate claimed profile</text></g></svg>
