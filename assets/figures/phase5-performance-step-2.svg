<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">Dynamic, static or hybrid?</title><desc id="desc">Measure p50/p95, tile bytes and cache state. These columns explain trade-offs; they are not invented latency measurements.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Dynamic, static or hybrid?</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Dynamic</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Query on cache miss</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Fresh high-zoom</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">detail</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Database work</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Pre-generated</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Build before serving</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Cheap repeated reads</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">Rebuild on changes</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Hybrid</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Pre-build low zoom</text><text x="483.3333333333333" y="208" font-size="18" fill="#213e45" text-anchor="start">Dynamic high zoom</text><text x="483.3333333333333" y="255" font-size="18" fill="#213e45" text-anchor="start">Declare hand-over</text></g></svg>
