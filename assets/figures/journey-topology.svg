<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Our two school areas share some space</title><desc id="scene-desc">Invented neighbourhood for learning. Local drawing distances are in metres; not a surveyed map.</desc><rect width="960" height="540" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="33" font-size="14" fill="#284c40" text-anchor="start">OUR NEIGHBOURHOOD / SAME PROJECT, NEXT STEP</text><text x="32" y="75" font-size="25" fill="#284c40" text-anchor="start">Our two school areas share some space</text><rect x="70" y="90" width="510" height="340" rx="4" fill="#f8faf5" stroke="#a8bfaa"/><rect x="121" y="328" width="68" height="51" rx="4" fill="#d4e7d8" stroke="#a8bfaa"/><text x="121" y="318" font-size="17" fill="#284c40" text-anchor="start">Park</text><path d="M155 260L495 260" stroke="#bc9c6b" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M291 260L291 192" stroke="#bc9c6b" stroke-width="2" fill="none" stroke-dasharray=""/><path d="M461 260L461 192" stroke="#bc9c6b" stroke-width="2" fill="none" stroke-dasharray=""/><rect x="285" y="186" width="12" height="12" rx="4" fill="#d7e6f0" stroke="#a8bfaa"/><text x="304" y="183" font-size="17" fill="#284c40" text-anchor="start">Home 1</text><rect x="455" y="186" width="12" height="12" rx="4" fill="#d7e6f0" stroke="#a8bfaa"/><text x="474" y="183" font-size="17" fill="#284c40" text-anchor="start">Home 2</text><circle cx="240" cy="260" r="170" fill="#5e9a7626" stroke="#245c48" stroke-width="2"/><circle cx="410" cy="260" r="170" fill="#79aec626" stroke="#3f779b" stroke-width="2"/><circle cx="240" cy="260" r="6" fill="#245c48" stroke="white" stroke-width="2"/><text x="249" y="248" font-size="18" fill="#284c40" text-anchor="start">School A</text><circle cx="410" cy="260" r="6" fill="#3f779b" stroke="white" stroke-width="2"/><text x="419" y="248" font-size="18" fill="#284c40" text-anchor="start">School B</text><text x="620" y="120" font-size="21" fill="#284c40" text-anchor="start">Same neighbourhood</text><text x="620" y="154" font-size="18" fill="#284c40" text-anchor="start">Schools A and B</text><text x="620" y="215" font-size="18" fill="#284c40" text-anchor="start">Circle edge: 200 m</text><text x="620" y="247" font-size="18" fill="#284c40" text-anchor="start">from that school</text><text x="620" y="305" font-size="18" fill="#284c40" text-anchor="start">The middle belongs</text><text x="620" y="336" font-size="18" fill="#284c40" text-anchor="start">to both circles.</text><text x="620" y="390" font-size="18" fill="#284c40" text-anchor="start">This is an overlap.</text><text x="32" y="514" font-size="15" fill="#284c40" text-anchor="start">Invented neighbourhood for learning. Local drawing distances are in metres; not a surveyed map.</text></g></svg>
