<svg xmlns="http://www.w3.org/2000/svg" width="720" height="734" viewBox="0 0 720 734" role="img" aria-labelledby="title desc"><title id="title">One cross-section through both buffers</title><desc id="desc">The lanes separate the two intervals for reading, not geographic northing. Along the line joining the schools, x=0…200 is inside both circular buffers.</desc><rect width="720" height="734" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">One cross-section through both buffers</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">-200</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">-50</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">0.5</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">100</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">1</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">250</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">1.5</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" 