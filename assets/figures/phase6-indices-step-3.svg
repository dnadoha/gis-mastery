<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Date-1 class areas</title><desc id="desc">10 + 2 + 2 + 2 = 16 pixels; 0.90 + 0.18 + 0.18 + 0.18 = 1.44 ha. Use physical pixel area in the stated CRS.</desc><rect width="720" height="390" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Date-1 class areas</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">hectares</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Dense: 10 pixels</text><rect x="300" y="112" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">0.9</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Sparse: 2 pixels</text><rect x="300" y="172" width="64" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">0.18</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Bare: 2 pixels</text><rect x="300" y="232" width="64" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">0.18</text><text x="36" y="315" font-size="17" fill="#213e45" text-anchor="start">Water: 2 pixels</text><rect x="300" y="292" width="64" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="315" font-size="17" fill="#213e45" text-anchor="end">0.18</text><line x1="300" y1="105" x2="300" y2="348" stroke="#213e45" stroke-width="2" /><text x="300" y="372" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="372" font-size="15" fill="#213e45" text-anchor="end">0.9</text></g></svg>
