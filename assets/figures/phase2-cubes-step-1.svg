<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="title desc"><title id="title">A data cube has named dimensions</title><desc id="desc">The array shape does not explain its axes by itself. Coordinate variables and attributes supply units, ordering, calendar and grid reference.</desc><rect width="720" height="352" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A data cube has named dimensions</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">temperature[time, level, lat, lon]</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">Axis</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">Example coordinate meaning</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">time</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">Observation date + calendar</text><rect x="36" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="244" font-size="18" fill="#213e45" text-anchor="middle">level</text><rect x="360" y="214" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="244" font-size="18" fill="#213e45" text-anchor="middle">Height or pressure + units</text><rect x="36" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="292" font-size="18" fill="#213e45" text-anchor="middle">lat / lon</text><rect x="360" y="262" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="292" font-size="18" fill="#213e45" text-anchor="middle">Horizontal location</text></g></svg>
