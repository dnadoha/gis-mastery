<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc"><title id="title">One dataset, three delivery contracts</title><desc id="desc">The payload determines what the browser can do. A clipped tile fragment is not the authoritative edit geometry.</desc><rect width="720" height="357" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">One dataset, three delivery contracts</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Raster image</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Server paints the</text><text x="46" y="186" font-size="18" fill="#213e45" text-anchor="start">map</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">PNG / JPEG</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Restyle on server</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">Vector tile</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Browser paints</text><text x="264.66666666666663" y="186" font-size="18" fill="#213e45" text-anchor="start">fragments</text><text x="264.66666666666663" y="233" font-size="18" fill="#213e45" text-anchor="start">MVT + style</text><text x="264.66666666666663" y="280" font-size="18" fill="#213e45" text-anchor="start">Fast display</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">Feature record</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Full geometry +</text><text x="483.3333333333333" y="186" font-size="18" fill="#213e45" text-anchor="start">attributes</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">GeoJSON + stable id</text><text x="483.3333333333333" y="280" font-size="18" fill="#213e45" text-anchor="start">Query and edit</text></g></svg>
