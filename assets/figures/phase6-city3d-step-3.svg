<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Screen-space error increases as you approach</title><desc id="desc">SSE = error × viewportHeight / (2 × distance × tan(fov/2)). With a 16 px threshold, the 250 m case needs refinement if children are available.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Screen-space error increases as you approach</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">pixels · error 10 m, viewport 1000 px, fov 90°</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Distance 1000 m</text><rect x="300" y="112" width="80" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">5</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Distance 500 m</text><rect x="300" y="172" width="160" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">10</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Distance 250 m</text><rect x="300" y="232" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">20</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">20</text></g></svg>
