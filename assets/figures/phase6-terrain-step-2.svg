<svg xmlns="http://www.w3.org/2000/svg" width="720" height="768" viewBox="0 0 720 768" role="img" aria-labelledby="title desc"><title id="title">A ridge blocks a low target</title><desc id="desc">At the ridge x=5, the low ray is below terrain while the high ray is above it. The profile illustrates occlusion; it is not a measured landscape.</desc><rect width="720" height="768" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A ridge blocks a low target</text><line x1="100" y1="110" x2="100" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="570" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><text x="100" y="596" font-size="15" fill="#213e45" text-anchor="middle">0</text><text x="88" y="575" font-size="15" fill="#213e45" text-anchor="end">0</text><line x1="215" y1="110" x2="215" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="455" x2="560" y2="455" stroke="#dce5e7" stroke-width="2" /><text x="215" y="596" font-size="15" fill="#213e45" text-anchor="middle">2.5</text><text x="88" y="460" font-size="15" fill="#213e45" text-anchor="end">2.5</text><line x1="330" y1="110" x2="330" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="340" x2="560" y2="340" stroke="#dce5e7" stroke-width="2" /><text x="330" y="596" font-size="15" fill="#213e45" text-anchor="middle">5</text><text x="88" y="345" font-size="15" fill="#213e45" text-anchor="end">5</text><line x1="445" y1="110" x2="445" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="225" x2="560" y2="225" stroke="#dce5e7" stroke-width="2" /><text x="445" y="596" font-size="15" fill="#213e45" text-anchor="middle">7.5</text><text x="88" y="230" font-size="15" fill="#213e45" text-anchor="end">7.5</text><line x1="560" y1="110" x2="560" y2="570" stroke="#dce5e7" stroke-width="2" /><line x1="100" y1="110" x2="560" y2="110" stroke="#dce5e7" stroke-width="2" /><text x="560" y="596" font-size="15" fill="#213e45" text-anchor="middle">10</text><text x="88" y="115" font-size="15" fill="#213e45" text-anchor="end">10</text><text x="100" y="88" font-size="17" fill="#23745d" text-anchor="start">Elevation (schematic)</text><text x="330" y="632" font-size="17" fill="#23745d" text-anchor="middle">Distance along ray (schematic)</text><polyline points="100,478 192,478 330,294 422,478 560,478" fill="none" stroke="#23745d" stroke-width="3" /><line x1="36" y1="664" x2="70" y2="664" stroke="#23745d" stroke-width="2" /><text x="82" y="670" font-size="17" fill="#213e45" text-anchor="start">Terrain</text><polyline points="100,386 560,478" fill="none" stroke="#ae521f" stroke-width="3" stroke-dasharray="8 4"/><line x1="36" y1="698" x2="70" y2="698" stroke="#ae521f" stroke-width="2" stroke-dasharray="8 4"/><text x="82" y="704" font-size="17" fill="#213e45" text-anchor="start">Ray to low target: blocked</text><polyline points="100,386 560,156" fill="none" stroke="#246eab" stroke-width="3" stroke-dasharray="8 4"/><line x1="36" y1="732" x2="70" y2="732" stroke="#246eab" stroke-width="2" stroke-dasharray="8 4"/><text x="82" y="738" font-size="17" fill="#213e45" text-anchor="start">Ray to high target: visible</text></g></svg>
