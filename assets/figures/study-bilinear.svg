<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Bilinear interpolation blends four samples</title><desc id="desc">Four source cell centres have values 10, 20, 30, 40. At u=0.25 and v=0.5 the weights are 0.375, 0.125, 0.375, 0.125 and output is 22.5.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Bilinear interpolation blends four samples</text><rect x="32" y="110" width="896" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><rect x="100" y="185" width="240" height="200" fill="#e3eef5" stroke="#246eab" stroke-width="2"/><line x1="160" y1="185" x2="160" y2="385" stroke="#ae521f" stroke-width="2" stroke-dasharray="5 5"/><line x1="100" y1="285" x2="340" y2="285" stroke="#ae521f" stroke-width="2" stroke-dasharray="5 5"/><circle cx="100" cy="185" r="6" fill="#246eab" stroke="white" stroke-width="2"/><text x="100" y="169" font-size="22" fill="#246eab" text-anchor="middle">10</text><circle cx="340" cy="185" r="6" fill="#246eab" stroke="white" stroke-width="2"/><text x="340" y="169" font-size="22" fill="#246eab" text-anchor="middle">20</text><circle cx="100" cy="385" r="6" fill="#246eab" stroke="white" stroke-width="2"/><text x="100" y="415" font-size="22" fill="#246eab" text-anchor="middle">30</text><circle cx="340" cy="385" r="6" fill="#246eab" stroke="white" stroke-width="2"/><text x="340" y="415" font-size="22" fill="#246eab" text-anchor="middle">40</text><circle cx="160" cy="285" r="8" fill="#ae521f" stroke="white" stroke-width="2"/><text x="175" y="274" font-size="23" fill="#ae521f" text-anchor="start">22.5</text><text x="100" y="152" font-size="20" fill="#213e45" text-anchor="start">u = 0.25 →</text><text x="80" y="450" font-size="20" fill="#213e45" text-anchor="start">v = 0.50 downward</text><text x="435" y="155" font-size="24" fill="#213e45" text-anchor="start">Weights sum to 1</text><text x="435" y="205" font-size="22" fill="#213e45" text-anchor="start">0.375 × 10 = 3.75</text><text x="435" y="249" font-size="22" fill="#213e45" text-anchor="start">0.125 × 20 = 2.50</text><text x="435" y="293" font-size="22" fill="#213e45" text-anchor="start">0.375 × 30 = 11.25</text><text x="435" y="337" font-size="22" fill="#213e45" text-anchor="start">0.125 × 40 = 5.00</text><text x="435" y="426" font-size="26" fill="#ae521f" text-anchor="start">Weighted sum = 22.5</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Corners here are source cell CENTRES. Interpolate continuous values; category IDs are not magnitudes.</text></g></svg>
