<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">A larger population cell needs the combined count</title><desc id="scene-desc">Both panels cover the same ground area. This aligned aggregation keeps the population total.</desc><rect width="960" height="540" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="33" font-size="14" fill="#284c40" text-anchor="start">OUR NEIGHBOURHOOD / SAME PROJECT, NEXT STEP</text><text x="32" y="75" font-size="25" fill="#284c40" text-anchor="start">A larger population cell needs the combined count</text><rect x="100" y="150" width="100" height="100" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="150" y="210" font-size="28" fill="#284c40" text-anchor="middle">10</text><rect x="200" y="150" width="100" height="100" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="250" y="210" font-size="28" fill="#284c40" text-anchor="middle">10</text><rect x="100" y="250" width="100" height="100" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="150" y="310" font-size="28" fill="#284c40" text-anchor="middle">10</text><rect x="200" y="250" width="100" height="100" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="250" y="310" font-size="28" fill="#284c40" text-anchor="middle">10</text><rect x="590" y="150" width="200" height="200" rx="4" fill="#edf4e7" stroke="#a8bfaa"/><text x="690" y="266" font-size="36" fill="#284c40" text-anchor="middle">40</text><text x="365" y="258" font-size="40" fill="#284c40" text-anchor="start">→</text><text x="95" y="400" font-size="21" fill="#284c40" text-anchor="start">Four 100 m × 100 m cells</text><text x="565" y="400" font-size="21" fill="#284c40" text-anchor="start">One 200 m × 200 m cell</text><text x="345" y="455" font-size="21" fill="#284c40" text-anchor="start">10 + 10 + 10 + 10 = 40 people</text><text x="32" y="514" font-size="15" fill="#284c40" text-anchor="start">Both panels cover the same ground area. This aligned aggregation keeps the population total.</text></g></svg>
