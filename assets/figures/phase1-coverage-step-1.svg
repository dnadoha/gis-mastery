<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Separate totals include some of the same people</title><desc id="desc">Each school’s total is valid on its own. Adding them counts any shared cell twice, so 240 is not yet the answer to “near at least one school”.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Separate totals include some of the same people</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">People · 10 per selected cell</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">School A: 12 cells</text><rect x="300" y="112" width="160" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">120</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">School B: 12 cells</text><rect x="300" y="172" width="160" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">120</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Naive sum</text><rect x="300" y="232" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">240</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">240</text></g></svg>
