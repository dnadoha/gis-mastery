<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Compare the output with the input contract</title><desc id="desc">Use ogrinfo and the GeoJSON checker on the files actually produced. A silently dropped record or renamed field must not hide behind a successful exit code.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Compare the output with the input contract</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Before conversion</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Count and bbox</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">CRS and fields</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Geometry and winding</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">After read-back</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Same expected count</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Explained CRS / schema</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Investigate differences</text></g></svg>
