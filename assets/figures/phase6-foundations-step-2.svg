<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">One field, different aggregation</title><desc id="desc">The raw observations are fixed. Grouping by rows yields 0 and 10; grouping by columns yields 5 and 5. Zoning changes the apparent contrast.</desc><rect width="720" height="420" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">One field, different aggregation</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Four cell values</text><rect x="36" y="118" width="322" height="46" rx="5" fill="hsl(163 34% 95%)" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">0</text><rect x="360" y="118" width="322" height="46" rx="5" fill="hsl(163 34% 95%)" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">0</text><rect x="36" y="166" width="322" height="46" rx="5" fill="hsl(163 34% 55%)" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="360" y="166" width="322" height="46" rx="5" fill="hsl(163 34% 55%)" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">10</text><text x="36" y="264" font-size="19" fill="#23745d" text-anchor="start">Row means versus column means</text><rect x="36" y="282" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="312" font-size="18" fill="#213e45" text-anchor="middle">rows: 0</text><rect x="360" y="282" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="312" font-size="18" fill="#213e45" text-anchor="middle">10</text><rect x="36" y="330" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="198" y="360" font-size="18" fill="#213e45" text-anchor="middle">columns: 5</text><rect x="360" y="330" width="322" height="46" rx="5" fill="#f0f5f5" stroke="#c6d6d5"/><text x="522" y="360" font-size="18" fill="#213e45" text-anchor="middle">5</text></g></svg>
