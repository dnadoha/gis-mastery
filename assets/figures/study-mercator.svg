<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Mercator enlarges equal ground patches</title><desc id="desc">Equal infinitesimal ground squares shown at a common map scale. At 60 degrees latitude both sides double and area quadruples.</desc>
<rect width="960" height="560" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Mercator enlarges equal ground patches</text><rect x="32" y="110" width="288" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="56" y="150" font-size="23" fill="#213e45" text-anchor="start">0° latitude</text><rect x="144" y="248" width="64" height="64" fill="#d5e8f6" stroke="#246eab" stroke-width="2"/><text x="176" y="384" font-size="21" fill="#213e45" text-anchor="middle">Length × 1.000</text><text x="176" y="418" font-size="21" fill="#213e45" text-anchor="middle">Area × 1.000</text><rect x="336" y="110" width="288" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="360" y="150" font-size="23" fill="#213e45" text-anchor="start">30° latitude</text><rect x="443.0495827718639" y="243.04958277186395" width="73.9008344562721" height="73.9008344562721" fill="#d5e8f6" stroke="#246eab" stroke-width="2"/><text x="480" y="384" font-size="21" fill="#213e45" text-anchor="middle">Length × 1.155</text><text x="480" y="418" font-size="21" fill="#213e45" text-anchor="middle">Area × 1.333</text><rect x="640" y="110" width="288" height="365" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><text x="664" y="150" font-size="23" fill="#213e45" text-anchor="start">60° latitude</text><rect x="720" y="216" width="127.99999999999997" height="127.99999999999997" fill="#d5e8f6" stroke="#246eab" stroke-width="2"/><text x="784" y="384" font-size="21" fill="#213e45" text-anchor="middle">Length × 2.000</text><text x="784" y="418" font-size="21" fill="#213e45" text-anchor="middle">Area × 4.000</text><line x1="32" y1="506" x2="928" y2="506" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="535" font-size="16" fill="#213e45" text-anchor="start">Local spherical approximation: k = sec(latitude); area factor = k². Squares share one drawing scale.</text></g></svg>
