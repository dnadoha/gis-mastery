<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Overviews reduce how many cells must be read</title><desc id="desc">Halving both dimensions quarters the cell count. The appropriate overview depends on display resolution and preserves an explicitly chosen resampling meaning.</desc><rect width="720" height="390" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Overviews reduce how many cells must be read</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">Cells · synthetic DEM pyramid</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Full: 1200 × 800</text><rect x="300" y="112" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">960000</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Factor 2: 600 × 400</text><rect x="300" y="172" width="80" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">240000</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Factor 4: 300 × 200</text><rect x="300" y="232" width="20" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">60000</text><text x="36" y="315" font-size="17" fill="#213e45" text-anchor="start">Factor 8: 150 × 100</text><rect x="300" y="292" width="5" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="315" font-size="17" fill="#213e45" text-anchor="end">15000</text><line x1="300" y1="105" x2="300" y2="348" stroke="#213e45" stroke-width="2" /><text x="300" y="372" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="372" font-size="15" fill="#213e45" text-anchor="end">960000</text></g></svg>
