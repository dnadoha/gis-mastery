<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" role="img" aria-labelledby="title desc"><title id="title">Four connected tracks</title><desc id="desc">Choose a measurable question first. A visually convincing map is an output to validate, not proof that the method fits.</desc><rect width="720" height="382" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Four connected tracks</text><rect x="32" y="80" width="206.66666666666666" height="257" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">A · Analysis</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Samples and terrain</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Surfaces and</text><text x="46" y="233" font-size="18" fill="#213e45" text-anchor="start">patterns</text><text x="46" y="280" font-size="18" fill="#213e45" text-anchor="start">Validate assumptions</text><rect x="250.66666666666666" y="80" width="206.66666666666666" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="264.66666666666663" y="112" font-size="20" fill="#23745d" text-anchor="start">B · Imagery</text><text x="264.66666666666663" y="161" font-size="18" fill="#213e45" text-anchor="start">Spectra through time</text><text x="264.66666666666663" y="208" font-size="18" fill="#213e45" text-anchor="start">Classes and change</text><text x="264.66666666666663" y="255" font-size="18" fill="#213e45" text-anchor="start">Assess error</text><rect x="469.3333333333333" y="80" width="206.66666666666666" height="282" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="483.3333333333333" y="112" font-size="20" fill="#23745d" text-anchor="start">C / D · 3D + ML</text><text x="483.3333333333333" y="161" font-size="18" fill="#213e45" text-anchor="start">Heights and</text><text x="483.3333333333333" y="186" font-size="18" fill="#213e45" text-anchor="start">predictors</text><text x="483.3333333333333" y="233" font-size="18" fill="#213e45" text-anchor="start">Objects and</text><text x="483.3333333333333" y="258" font-size="18" fill="#213e45" text-anchor="start">predictions</text><text x="483.3333333333333" y="305" font-size="18" fill="#213e45" text-anchor="start">Hold out places</text></g></svg>
