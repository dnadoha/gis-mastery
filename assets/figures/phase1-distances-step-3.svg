<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Use the stated 200 m direct-distance rule</title><desc id="desc">Compare each bar to 200 m. Equality is included in our rule; this test does not measure distance along roads or prove a walkable route.</desc><rect width="720" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Use the stated 200 m direct-distance rule</text><text x="36" y="86" font-size="16" fill="#23745d" text-anchor="start">Direct local-grid distance (m)</text><text x="36" y="135" font-size="17" fill="#213e45" text-anchor="start">Home 1: included</text><rect x="300" y="112" width="106.66666666666663" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="135" font-size="17" fill="#213e45" text-anchor="end">100</text><text x="36" y="195" font-size="17" fill="#213e45" text-anchor="start">Boundary: included</text><rect x="300" y="172" width="213.33333333333326" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="195" font-size="17" fill="#213e45" text-anchor="end">200</text><text x="36" y="255" font-size="17" fill="#213e45" text-anchor="start">Example outside</text><rect x="300" y="232" width="320" height="34" rx="5" fill="#a8d4c0" stroke="none"/><text x="674" y="255" font-size="17" fill="#213e45" text-anchor="end">300</text><line x1="300" y1="105" x2="300" y2="288" stroke="#213e45" stroke-width="2" /><text x="300" y="312" font-size="15" fill="#213e45" text-anchor="start">0</text><text x="620" y="312" font-size="15" fill="#213e45" text-anchor="end">300</text></g></svg>
