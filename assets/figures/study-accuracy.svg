<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Repeatability does not guarantee accuracy</title><desc id="desc">Four targets independently vary systematic bias and observation spread. Crosses mark the truth. A tightly grouped biased sample is precise but inaccurate.</desc>
<rect width="960" height="600" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="32" font-size="14" fill="#23745d" text-anchor="start">FIELDNOTES / VISUAL EXPLANATION</text><text x="32" y="72" font-size="28" fill="#213e45" text-anchor="start">Repeatability does not guarantee accuracy</text><rect x="32" y="108" width="440" height="194" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><circle cx="146" cy="204" r="24" fill="none" stroke="#bdcdd2"/><circle cx="146" cy="204" r="48" fill="none" stroke="#bdcdd2"/><circle cx="146" cy="204" r="72" fill="none" stroke="#bdcdd2"/><line x1="137" y1="204" x2="155" y2="204" stroke="#213e45" stroke-width="2" /><line x1="146" y1="195" x2="146" y2="213" stroke="#213e45" stroke-width="2" /><circle cx="137" cy="199.5" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="155" cy="208.5" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="141.5" cy="213" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="150.5" cy="195" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="138.8" cy="210.3" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="153.2" cy="197.7" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><text x="252" y="174" font-size="18" fill="#23745d" text-anchor="start">HIGH PRECISION</text><text x="252" y="210" font-size="19" fill="#213e45" text-anchor="start">Centred on truth</text><text x="252" y="236" font-size="19" fill="#213e45" text-anchor="start">on average</text><text x="52" y="289" font-size="17" fill="#213e45" text-anchor="start">Small bias / tight repeats</text><rect x="488" y="108" width="440" height="194" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><circle cx="602" cy="204" r="24" fill="none" stroke="#bdcdd2"/><circle cx="602" cy="204" r="48" fill="none" stroke="#bdcdd2"/><circle cx="602" cy="204" r="72" fill="none" stroke="#bdcdd2"/><line x1="593" y1="204" x2="611" y2="204" stroke="#213e45" stroke-width="2" /><line x1="602" y1="195" x2="602" y2="213" stroke="#213e45" stroke-width="2" /><circle cx="635" cy="199.5" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="653" cy="208.5" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="639.5" cy="213" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="648.5" cy="195" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="636.8" cy="210.3" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="651.2" cy="197.7" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><text x="708" y="174" font-size="18" fill="#23745d" text-anchor="start">HIGH PRECISION</text><text x="708" y="210" font-size="19" fill="#213e45" text-anchor="start">Biased away</text><text x="708" y="236" font-size="19" fill="#213e45" text-anchor="start">from truth</text><text x="508" y="289" font-size="17" fill="#213e45" text-anchor="start">Large bias / tight repeats</text><rect x="32" y="316" width="440" height="194" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><circle cx="146" cy="412" r="24" fill="none" stroke="#bdcdd2"/><circle cx="146" cy="412" r="48" fill="none" stroke="#bdcdd2"/><circle cx="146" cy="412" r="72" fill="none" stroke="#bdcdd2"/><line x1="137" y1="412" x2="155" y2="412" stroke="#213e45" stroke-width="2" /><line x1="146" y1="403" x2="146" y2="421" stroke="#213e45" stroke-width="2" /><circle cx="104" cy="391" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="188" cy="433" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="125" cy="454" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="167" cy="370" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="112.4" cy="441.4" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="179.6" cy="382.6" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><text x="252" y="382" font-size="18" fill="#23745d" text-anchor="start">LOW PRECISION</text><text x="252" y="418" font-size="19" fill="#213e45" text-anchor="start">Centred on truth</text><text x="252" y="444" font-size="19" fill="#213e45" text-anchor="start">on average</text><text x="52" y="497" font-size="17" fill="#213e45" text-anchor="start">Small bias / wide spread</text><rect x="488" y="316" width="440" height="194" rx="12" fill="#f4f7f8" stroke="#d7e2e5"/><circle cx="602" cy="412" r="24" fill="none" stroke="#bdcdd2"/><circle cx="602" cy="412" r="48" fill="none" stroke="#bdcdd2"/><circle cx="602" cy="412" r="72" fill="none" stroke="#bdcdd2"/><line x1="593" y1="412" x2="611" y2="412" stroke="#213e45" stroke-width="2" /><line x1="602" y1="403" x2="602" y2="421" stroke="#213e45" stroke-width="2" /><circle cx="602" cy="391" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="686" cy="433" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="623" cy="454" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="665" cy="370" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="610.4" cy="441.4" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><circle cx="677.6" cy="382.6" r="4" fill="#ae521f" stroke="white" stroke-width="2"/><text x="708" y="382" font-size="18" fill="#23745d" text-anchor="start">LOW PRECISION</text><text x="708" y="418" font-size="19" fill="#213e45" text-anchor="start">Biased away</text><text x="708" y="444" font-size="19" fill="#213e45" text-anchor="start">from truth</text><text x="508" y="497" font-size="17" fill="#213e45" text-anchor="start">Large bias / wide spread</text><line x1="32" y1="546" x2="928" y2="546" stroke="#d7e2e5" stroke-width="2" /><text x="32" y="575" font-size="16" fill="#213e45" text-anchor="start">Synthetic observations; identical target scales. Cross = truth, dots = repeats. Accuracy also depends on spread.</text></g></svg>
