<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Chunk shape should fit the query</title><desc id="desc">Neither chunk shape is best for every access pattern. Estimate which chunks each query must touch before choosing or accepting the layout.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Chunk shape should fit the query</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">One map at a time</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Fix time and level</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Read many lat/lon cells</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Spatial slabs help</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">One site through time</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Fix location and level</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Read many dates</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Time-oriented chunks help</text></g></svg>
