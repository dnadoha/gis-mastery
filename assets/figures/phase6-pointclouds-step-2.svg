<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">PDAL surface pipelines</title><desc id="desc">Equal resolution alone does not guarantee matching grids. CRS, origin, extent and vertical datum must agree.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">PDAL surface pipelines</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">DTM · bare earth</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Read → flag outliers</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">SMRF → class 2 only</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">1 m IDW raster</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">DSM · top surface</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Read → remove noise</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">Retain surface returns</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">1 m maximum-Z raster</text></g></svg>
