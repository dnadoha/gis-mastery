<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">A move can stale more than one tile</title><desc id="desc">Highlighted cells illustrate buffered tile dependencies, not geographic scale. Purge the union of old and new footprints, never only the new point.</desc><rect width="720" height="420" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">A move can stale more than one tile</text><text x="36" y="100" font-size="19" fill="#23745d" text-anchor="start">Old location near an edge</text><rect x="36" y="118" width="322" height="46" rx="5" fill="#fce2bc" stroke="#c6d6d5"/><text x="198" y="148" font-size="18" fill="#213e45" text-anchor="middle">neighbour</text><rect x="360" y="118" width="322" height="46" rx="5" fill="#fce2bc" stroke="#c6d6d5"/><text x="522" y="148" font-size="18" fill="#213e45" text-anchor="middle">old point</text><rect x="36" y="166" width="322" height="46" rx="5" fill="#edf2f4" stroke="#c6d6d5"/><text x="198" y="196" font-size="18" fill="#213e45" text-anchor="middle">unchanged</text><rect x="360" y="166" width="322" height="46" rx="5" fill="#edf2f4" stroke="#c6d6d5"/><text x="522" y="196" font-size="18" fill="#213e45" text-anchor="middle">unchanged</text><text x="36" y="264" font-size="19" fill="#23745d" text-anchor="start">New location</text><rect x="36" y="282" width="322" height="46" rx="5" fill="#edf2f4" stroke="#c6d6d5"/><text x="198" y="312" font-size="18" fill="#213e45" text-anchor="middle">unchanged</text><rect x="360" y="282" width="322" height="46" rx="5" fill="#edf2f4" stroke="#c6d6d5"/><text x="522" y="312" font-size="18" fill="#213e45" text-anchor="middle">unchanged</text><rect x="36" y="330" width="322" height="46" rx="5" fill="#cce7de" stroke="#c6d6d5"/><text x="198" y="360" font-size="18" fill="#213e45" text-anchor="middle">new point</text><rect x="360" y="330" width="322" height="46" rx="5" fill="#cce7de" stroke="#c6d6d5"/><text x="522" y="360" font-size="18" fill="#213e45" text-anchor="middle">neighbour</text></g></svg>
