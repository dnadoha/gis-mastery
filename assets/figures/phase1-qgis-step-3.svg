<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title desc"><title id="title">Changing the view is not changing the file</title><desc id="desc">The exported metre-coordinate copy should match our known conversion. Changing only the project view does not rewrite the geographic source coordinates.</desc><rect width="720" height="332" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="28" font-size="13" fill="#23745d" text-anchor="start">FIELDNOTES / STEP VISUAL</text><text x="32" y="59" font-size="23" fill="#213e45" text-anchor="start">Changing the view is not changing the file</text><rect x="32" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="46" y="112" font-size="20" fill="#23745d" text-anchor="start">Project CRS</text><text x="46" y="161" font-size="18" fill="#213e45" text-anchor="start">Controls map display</text><text x="46" y="208" font-size="18" fill="#213e45" text-anchor="start">Original CSV unchanged</text><text x="46" y="255" font-size="18" fill="#213e45" text-anchor="start">Can reproject on screen</text><rect x="360" y="80" width="316" height="232" rx="5" fill="#f1f6f4" stroke="#c6d6d5"/><text x="374" y="112" font-size="20" fill="#23745d" text-anchor="start">Export target CRS</text><text x="374" y="161" font-size="18" fill="#213e45" text-anchor="start">Creates new coordinates</text><text x="374" y="208" font-size="18" fill="#213e45" text-anchor="start">EPSG:32646 analysis copy</text><text x="374" y="255" font-size="18" fill="#213e45" text-anchor="start">Check 236377.4, 2635628.6</text></g></svg>
